<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Apple Music Lyrics Pro</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", Roboto, Helvetica, Arial, sans-serif;
      background: #000000;
      color: #ffffff;
      height: 100vh;
      height: 100dvh;
      overflow: hidden;
      display: flex;
    }

    /* Ambient Animated Blur Background */
    .bg-blur {
      position: absolute;
      top: -10%;
      left: -10%;
      width: 120%;
      height: 120%;
      background: radial-gradient(circle, #4a154b 0%, #111111 80%);
      filter: blur(60px);
      z-index: 1;
      transition: background 1.5s ease;
    }

    /* Main Container */
    .app-container {
      position: relative;
      z-index: 2;
      display: flex;
      width: 100%;
      height: 100%;
      padding-bottom: 110px;
    }

    /* Developer Badge (Centered Top) */
    .dev-badge {
      position: absolute;
      top: 18px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 999;
      font-size: 0.8rem;
      font-weight: 700;
      color: #ffffff;
      background: rgba(0, 0, 0, 0.55);
      padding: 0.4rem 1.1rem;
      border-radius: 20px;
      border: 1px solid rgba(255, 255, 255, 0.25);
      box-shadow: 0 4px 15px rgba(0,0,0,0.3);
      pointer-events: none;
      white-space: nowrap;
    }

    /* Hero Left Panel (Desktop layout) */
    .hero-panel {
      display: none;
      flex: 1;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 2rem;
      text-align: center;
    }

    .hero-title {
      font-size: 2rem;
      font-weight: 800;
      margin-top: 1rem;
    }

    .hero-artist {
      font-size: 1.2rem;
      opacity: 0.7;
      margin-top: 0.4rem;
    }

    /* Lyrics Scroll Container */
    .lyrics-panel {
      flex: 1;
      height: 100%;
      overflow-y: auto;
      padding: 40vh 1.8rem 20vh 1.8rem;
      scrollbar-width: none;
    }

    .lyrics-panel::-webkit-scrollbar {
      display: none;
    }

    /* --- LYRICS TYPOGRAPHY & ANIMATION --- */
    .line {
      font-size: clamp(2rem, 6.5vw, 3.2rem);
      font-weight: 800;
      line-height: 1.35;
      margin-bottom: clamp(2rem, 5.5vw, 3rem);
      cursor: pointer;
      transform-origin: left center;
      word-break: break-word;
      overflow-wrap: break-word;

      color: rgba(255, 255, 255, 0.25);
      filter: blur(6px);
      opacity: 0.35;
      transform: scale(0.92);
      transition: filter 0.45s ease, opacity 0.45s ease, transform 0.45s ease;
    }

    .line.past {
      color: rgba(255, 255, 255, 0.35);
      filter: blur(0px);
      opacity: 0.45;
      transform: scale(0.95);
    }

    .line.active {
      opacity: 1;
      filter: blur(0px);
      transform: scale(1.04);
    }

    .line .word {
      display: inline-block;
      margin-right: 0.25em;
      color: rgba(255, 255, 255, 0.3);
      transition: color 0.15s ease, text-shadow 0.2s ease;
    }

    .line.active .word.filled {
      color: #ffffff;
      text-shadow: 0 0 15px rgba(255, 255, 255, 0.6);
    }

    .lyrics-footer {
      margin-top: 4rem;
      padding-top: 1.5rem;
      padding-bottom: 3rem;
      font-size: 0.85rem;
      font-weight: 600;
      color: rgba(255, 255, 255, 0.4);
      border-top: 1px solid rgba(255, 255, 255, 0.1);
    }

    /* Bottom Player Bar */
    .player-bar {
      position: fixed;
      bottom: 1.2rem;
      left: 50%;
      transform: translateX(-50%);
      width: calc(100% - 2.4rem);
      max-width: 500px;
      background: rgba(255, 255, 255, 0.15);
      backdrop-filter: blur(25px);
      -webkit-backdrop-filter: blur(25px);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 24px;
      padding: 0.8rem 1.2rem;
      z-index: 100;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }

    .player-info {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .track-meta {
      display: flex;
      align-items: center;
      gap: 0.8rem;
      overflow: hidden;
    }

    .album-art {
      width: 44px;
      height: 44px;
      border-radius: 10px;
      background: rgba(255,255,255,0.1);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.2rem;
      flex-shrink: 0;
    }

    .track-text {
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .track-title {
      font-weight: 700;
      font-size: 0.95rem;
    }

    .track-artist {
      font-size: 0.8rem;
      opacity: 0.7;
    }

    .controls {
      display: flex;
      align-items: center;
      gap: 0.8rem;
    }

    .btn-icon {
      background: none;
      border: none;
      color: #ffffff;
      font-size: 1.4rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 36px;
      height: 36px;
      border-radius: 50%;
    }

    .btn-play {
      background: #ffffff;
      color: #000000;
      font-size: 1.1rem;
    }

    .progress-container {
      width: 100%;
      height: 4px;
      background: rgba(255, 255, 255, 0.2);
      border-radius: 2px;
      margin-top: 0.8rem;
      position: relative;
      cursor: pointer;
    }

    .progress-fill {
      height: 100%;
      background: #ffffff;
      border-radius: 2px;
      width: 0%;
    }

    .time-labels {
      display: flex;
      justify-content: space-between;
      font-size: 0.7rem;
      opacity: 0.6;
      margin-top: 0.3rem;
    }

    /* Modal Sheet */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.6);
      backdrop-filter: blur(10px);
      z-index: 1000;
      display: none;
      align-items: flex-end;
      justify-content: center;
    }

    .modal-overlay.open {
      display: flex;
    }

    .modal-card {
      width: 100%;
      max-width: 500px;
      background: #1c1c1e;
      border-radius: 28px 28px 0 0;
      padding: 1.5rem;
      box-shadow: 0 -10px 40px rgba(0,0,0,0.8);
      position: relative;
    }

    .modal-close {
      position: absolute;
      top: 1.2rem;
      right: 1.2rem;
      background: rgba(255,255,255,0.1);
      border: none;
      color: #ffffff;
      width: 30px;
      height: 30px;
      border-radius: 50%;
      font-size: 1rem;
      cursor: pointer;
    }

    .modal-title {
      font-size: 1.2rem;
      font-weight: 700;
      margin-bottom: 1.2rem;
    }

    .input-group {
      margin-bottom: 1rem;
    }

    .input-group label {
      display: block;
      font-size: 0.8rem;
      opacity: 0.7;
      margin-bottom: 0.4rem;
    }

    .input-control {
      width: 100%;
      padding: 0.75rem 1rem;
      border-radius: 12px;
      border: 1px solid rgba(255,255,255,0.15);
      background: rgba(255,255,255,0.08);
      color: #ffffff;
      font-size: 0.95rem;
      outline: none;
    }

    .file-btn {
      width: 100%;
      padding: 0.75rem;
      border-radius: 12px;
      background: rgba(255,255,255,0.1);
      border: 1px dashed rgba(255,255,255,0.3);
      color: #ffffff;
      font-weight: 600;
      cursor: pointer;
      text-align: center;
      margin-bottom: 1rem;
      display: block;
    }

    .btn-action {
      width: 100%;
      padding: 0.85rem;
      border-radius: 14px;
      background: #ffffff;
      color: #000000;
      font-weight: 700;
      border: none;
      cursor: pointer;
      font-size: 1rem;
      margin-top: 0.5rem;
    }

    .status-text {
      font-size: 0.8rem;
      color: #34c759;
      margin-top: 0.8rem;
      text-align: center;
      min-height: 1.2em;
    }

    .sync-offset-box {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: 1rem;
      background: rgba(255,255,255,0.05);
      padding: 0.6rem 1rem;
      border-radius: 12px;
    }

    .offset-btn {
      background: rgba(255,255,255,0.15);
      border: none;
      color: #ffffff;
      padding: 0.4rem 0.8rem;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
    }

    @media (min-width: 768px) {
      .hero-panel { display: flex; }
      .dev-badge { top: 24px; }
    }
  </style>
</head>
<body>

  <div class="bg-blur" id="bgBlur"></div>

  <div class="app-container">
    <div class="dev-badge">Made by me</div>

    <div class="hero-panel">
      <div class="album-art" id="heroArt" style="width:200px; height:200px; font-size:4rem; border-radius:20px;">🎵</div>
      <div class="hero-title" id="heroTitle">Apple Music Lyrics</div>
      <div class="hero-artist" id="heroArtist">Search a song to start</div>
    </div>

    <div class="lyrics-panel" id="lyricsDisplay">
      <div class="line">Tap ⚙️ below to search any song or load audio!</div>
    </div>
  </div>

  <div class="player-bar">
    <div class="player-info">
      <div class="track-meta">
        <div class="album-art" id="playerArt">🎵</div>
        <div class="track-text">
          <div class="track-title" id="displayTitle">No Track Loaded</div>
          <div class="track-artist" id="displayArtist">Tap gear to load</div>
        </div>
      </div>
      <div class="controls">
        <button class="btn-icon btn-play" id="playBtn">▶</button>
        <button class="btn-icon" id="gearBtn">⚙️</button>
      </div>
    </div>
    
    <div class="progress-container" id="progressContainer">
      <div class="progress-fill" id="progressFill"></div>
    </div>
    <div class="time-labels">
      <span id="currTime">0:00</span>
      <span id="durTime">0:00</span>
    </div>
  </div>

  <audio id="audioPlayer"></audio>

  <div class="modal-overlay" id="modalOverlay">
    <div class="modal-card">
      <button class="modal-close" id="closeModalBtn">✕</button>
      <div class="modal-title">Song & Lyrics Options</div>

      <label class="file-btn" for="audioFileInput">
        📁 Choose Local Audio File (.mp3, .m4a)
      </label>
      <input type="file" id="audioFileInput" accept="audio/*" style="display:none;" />

      <div class="input-group">
        <label>Song Title</label>
        <input type="text" class="input-control" id="trackInput" placeholder="e.g. Husn" value="Husn" />
      </div>

      <div class="input-group">
        <label>Artist Name</label>
        <input type="text" class="input-control" id="artistInput" placeholder="e.g. Anuv Jain" value="Anuv Jain" />
      </div>

      <button class="btn-action" id="searchBtn">Search & Play Song</button>

      <div class="sync-offset-box">
        <span style="font-size: 0.85rem; opacity: 0.8;">Sync Timing Offset:</span>
        <div>
          <button class="offset-btn" id="offsetMinus">-0.5s</button>
          <span id="offsetVal" style="margin: 0 0.5rem; font-weight:700;">0.0s</span>
          <button class="offset-btn" id="offsetPlus">+0.5s</button>
        </div>
      </div>

      <div class="status-text" id="statusText"></div>
    </div>
  </div>

  <script>
    const audioPlayer = document.getElementById('audioPlayer');
    const display = document.getElementById('lyricsDisplay');
    const playBtn = document.getElementById('playBtn');
    const gearBtn = document.getElementById('gearBtn');
    const closeModalBtn = document.getElementById('closeModalBtn');
    const modalOverlay = document.getElementById('modalOverlay');
    const searchBtn = document.getElementById('searchBtn');
    const trackInput = document.getElementById('trackInput');
    const artistInput = document.getElementById('artistInput');
    const audioFileInput = document.getElementById('audioFileInput');
    const statusText = document.getElementById('statusText');
    const progressContainer = document.getElementById('progressContainer');
    const progressFill = document.getElementById('progressFill');
    const currTimeText = document.getElementById('currTime');
    const durTimeText = document.getElementById('durTime');
    
    let parsedLyrics = [];
    let lyricOffset = 0.0;
    let autoScrollEnabled = true;

    function formatTime(secs) {
      if (isNaN(secs)) return '0:00';
      const m = Math.floor(secs / 60);
      const s = Math.floor(secs % 60);
      return `${m}:${s < 10 ? '0' : ''}${s}`;
    }

    function containsDevanagari(text) {
      return /[\u0900-\u097F]/.test(text);
    }

    function parseLRC(lrcText) {
      const lines = lrcText.split('\n');
      const result = [];
      const timeRegex = /\[(\d{2}):(\d{2})\.(\d{2,3})\]/;

      for (let line of lines) {
        const match = timeRegex.exec(line);
        if (match) {
          const minutes = parseInt(match[1], 10);
          const seconds = parseInt(match[2], 10);
          const millis = parseInt(match[3].padEnd(3, '0'), 10);
          const time = minutes * 60 + seconds + millis / 1000;
          const text = line.replace(timeRegex, '').trim();

          if (text) {
            result.push({ time, text });
          }
        }
      }
      return result.sort((a, b) => a.time - b.time);
    }

    function renderLyrics() {
      display.innerHTML = '';
      if (parsedLyrics.length === 0) {
        display.innerHTML = '<div class="line">No timed lyrics found.</div>';
        return;
      }

      parsedLyrics.forEach((item, index) => {
        const lineEl = document.createElement('div');
        lineEl.className = 'line';
        lineEl.id = `line-${index}`;

        const words = item.text.split(' ');
        words.forEach((wordText) => {
          const wordSpan = document.createElement('span');
          wordSpan.className = 'word';
          wordSpan.innerText = wordText;
          lineEl.appendChild(wordSpan);
        });

        lineEl.addEventListener('click', () => {
          audioPlayer.currentTime = Math.max(0, item.time + lyricOffset);
          audioPlayer.play();
          playBtn.innerText = '⏸';
          autoScrollEnabled = true;
        });

        display.appendChild(lineEl);
      });

      const footer = document.createElement('div');
      footer.className = 'lyrics-footer';
      footer.innerHTML = 'Made by <span style="color:#fff;">me</span>';
      display.appendChild(footer);
    }

    async function fetchLyrics() {
      const track = trackInput.value.trim();
      const artist = artistInput.value.trim();

      const queries = [
        `${track} ${artist} Romanized`,
        `${track} ${artist} Hinglish`,
        `${track} ${artist}`
      ];

      try {
        let match = null;

        for (const query of queries) {
          const url = `https://lrclib.net/api/search?q=${encodeURIComponent(query)}`;
          const response = await fetch(url);
          const data = await response.json();

          if (Array.isArray(data) && data.length > 0) {
            const englishScriptMatch = data.find(item => 
              item.syncedLyrics && 
              item.syncedLyrics.length > 0 && 
              !containsDevanagari(item.syncedLyrics)
            );

            if (englishScriptMatch) {
              match = englishScriptMatch;
              break;
            }
          }
        }

        if (!match) {
          const fallbackUrl = `https://lrclib.net/api/search?q=${encodeURIComponent(track + ' ' + artist)}`;
          const fallbackRes = await fetch(fallbackUrl);
          const fallbackData = await fallbackRes.json();
          if (Array.isArray(fallbackData)) {
            match = fallbackData.find(item => item.syncedLyrics);
          }
        }

        if (match && match.syncedLyrics) {
          parsedLyrics = parseLRC(match.syncedLyrics);
          renderLyrics();
          modalOverlay.classList.remove('open');
        } else {
          statusText.innerText = 'No timed lyrics found.';
        }
      } catch (err) {
        console.error(err);
        statusText.innerText = 'Error loading lyrics.';
      }
    }

    async function searchAndPlay() {
  const track = trackInput.value.trim();
  const artist = artistInput.value.trim();

  if (!track) {
    statusText.innerText = 'Please enter a song name!';
    return;
  }

  statusText.innerText = `Searching audio for "${track}"...`;

  try {
    const rawQuery = `${track} ${artist}`.trim();
    const targetApi = `https://saavn.dev/api/search/songs?query=${encodeURIComponent(rawQuery)}&limit=1`;
    
    // Pass through public CORS proxy to strip headers blocking Netlify
    const proxyUrl = `https://api.allorigins.win/get?url=${encodeURIComponent(targetApi)}`;

    const response = await fetch(proxyUrl);
    const proxyData = await response.json();
    const result = JSON.parse(proxyData.contents);

    if (result && result.success && result.data.results.length > 0) {
      const song = result.data.results[0];
      const downloadUrls = song.downloadUrl;

      if (downloadUrls && downloadUrls.length > 0) {
        const audioUrl = downloadUrls[downloadUrls.length - 1].url;

        audioPlayer.src = audioUrl;
        audioPlayer.load();

        const displayTrack = song.name || track;
        const displayArtist = (song.artists && song.artists.primary && song.artists.primary[0]) 
          ? song.artists.primary[0].name 
          : (artist || 'Artist');

        document.getElementById('displayTitle').innerText = displayTrack;
        document.getElementById('displayArtist').innerText = displayArtist;
        document.getElementById('heroTitle').innerText = displayTrack;
        document.getElementById('heroArtist').innerText = displayArtist;

        const playPromise = audioPlayer.play();
        if (playPromise !== undefined) {
          playPromise
            .then(() => {
              playBtn.innerText = '⏸';
              statusText.innerText = 'Playing online song!';
            })
            .catch(err => {
              console.log('Mobile autoplay handled:', err);
              statusText.innerText = 'Audio ready! Tap ▶ Play button.';
            });
        }
      }
    } else {
      statusText.innerText = 'Audio stream not found online.';
    }
  } catch (err) {
    console.error('Fetch error:', err);
    statusText.innerText = 'Unable to connect to audio server.';
  }

  await fetchLyrics();
}

    audioPlayer.addEventListener('timeupdate', () => {
      const currentTime = audioPlayer.currentTime - lyricOffset;
      let activeIndex = -1;

      for (let i = 0; i < parsedLyrics.length; i++) {
        if (currentTime >= parsedLyrics[i].time) {
          activeIndex = i;
        } else {
          break;
        }
      }

      const allLines = document.querySelectorAll('.line');
      allLines.forEach((el, index) => {
        const wordSpans = el.querySelectorAll('.word');

        if (index < activeIndex) {
          el.classList.add('past');
          el.classList.remove('active');
          wordSpans.forEach(w => w.classList.add('filled'));
        } else if (index === activeIndex) {
          el.classList.remove('past');
          
          if (!el.classList.contains('active')) {
            el.classList.add('active');

            if (autoScrollEnabled) {
              const panelHeight = display.clientHeight;
              const lineOffsetTop = el.offsetTop;
              const lineHeight = el.clientHeight;
              const targetScroll = lineOffsetTop - (panelHeight / 2) + (lineHeight / 2);

              display.scrollTo({
                top: targetScroll,
                behavior: 'smooth'
              });
            }
          }

          const currentLineTime = parsedLyrics[activeIndex].time;
          const nextLineTime = parsedLyrics[activeIndex + 1] 
            ? parsedLyrics[activeIndex + 1].time 
            : currentLineTime + 4.0;

          const lineDuration = nextLineTime - currentLineTime;
          const progress = Math.min(Math.max((currentTime - currentLineTime) / lineDuration, 0), 1);
          const wordsToFill = Math.floor(progress * wordSpans.length);

          wordSpans.forEach((wSpan, wIdx) => {
            if (wIdx <= wordsToFill) {
              wSpan.classList.add('filled');
            } else {
              wSpan.classList.remove('filled');
            }
          });
        } else {
          el.classList.remove('past', 'active');
          wordSpans.forEach(w => w.classList.remove('filled'));
        }
      });

      if (audioPlayer.duration) {
        const pct = (audioPlayer.currentTime / audioPlayer.duration) * 100;
        progressFill.style.width = `${pct}%`;
        currTimeText.innerText = formatTime(audioPlayer.currentTime);
        durTimeText.innerText = formatTime(audioPlayer.duration);
      }
    });

    playBtn.addEventListener('click', () => {
      if (audioPlayer.paused) {
        if (audioPlayer.src) {
          audioPlayer.play();
          playBtn.innerText = '⏸';
        } else {
          modalOverlay.classList.add('open');
        }
      } else {
        audioPlayer.pause();
        playBtn.innerText = '▶';
      }
    });

    gearBtn.addEventListener('click', () => modalOverlay.classList.add('open'));
    closeModalBtn.addEventListener('click', () => modalOverlay.classList.remove('open'));
    searchBtn.addEventListener('click', searchAndPlay);

    audioFileInput.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (file) {
        const fileUrl = URL.createObjectURL(file);
        audioPlayer.src = fileUrl;
        audioPlayer.load();
        document.getElementById('displayTitle').innerText = file.name.replace(/\.[^/.]+$/, "");
        document.getElementById('displayArtist').innerText = 'Local Audio';
        statusText.innerText = 'Local audio loaded!';
        audioPlayer.play();
        playBtn.innerText = '⏸';
      }
    });

    progressContainer.addEventListener('click', (e) => {
      if (!audioPlayer.duration) return;
      const rect = progressContainer.getBoundingClientRect();
      const clickX = e.clientX - rect.left;
      const pct = clickX / rect.width;
      audioPlayer.currentTime = pct * audioPlayer.duration;
    });

    document.getElementById('offsetMinus').addEventListener('click', () => {
      lyricOffset -= 0.5;
      document.getElementById('offsetVal').innerText = `${lyricOffset >= 0 ? '+' : ''}${lyricOffset.toFixed(1)}s`;
    });
    document.getElementById('offsetPlus').addEventListener('click', () => {
      lyricOffset += 0.5;
      document.getElementById('offsetVal').innerText = `${lyricOffset >= 0 ? '+' : ''}${lyricOffset.toFixed(1)}s`;
    });

    display.addEventListener('wheel', () => autoScrollEnabled = false);
    display.addEventListener('touchmove', () => autoScrollEnabled = false);
  </script>
</body>
</html>
