<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Apple Music Lyrics Pro - Local Player</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Bebas+Neue&family=Permanent+Marker&family=Space+Mono:wght@700&display=swap" rel="stylesheet">
  
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jsmediatags/3.9.5/jsmediatags.min.js"></script>
  
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    body { font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", sans-serif; background: #000000; color: #ffffff; height: 100vh; height: 100dvh; overflow: hidden; display: flex; }
    .bg-blur { position: absolute; top: -10%; left: -10%; width: 120%; height: 120%; background: radial-gradient(circle, #3a1c40 0%, #0d0d11 80%); filter: blur(60px); z-index: 1; transition: background 0.8s ease-in-out; background-size: cover; background-position: center; }
    .bg-rgb-overlay { position: absolute; inset: 0; z-index: 2; background: radial-gradient(circle, var(--custom-color, transparent) 0%, transparent 80%); opacity: 0.6; filter: blur(80px); mix-blend-mode: screen; pointer-events: none; transition: background 0.3s ease; }
    
    .app-container { position: relative; z-index: 3; display: flex; width: 100%; height: 100%; padding-bottom: 210px; transition: padding 0.3s; }
    .dev-badge { position: absolute; top: 18px; left: 50%; transform: translateX(-50%); z-index: 999; font-size: 0.78rem; font-weight: 800; color: #ffffff; background: rgba(255, 255, 255, 0.12); backdrop-filter: blur(20px); border-radius: 20px; border: 1px solid rgba(255, 255, 255, 0.2); padding: 0.5rem 1.2rem; pointer-events: none; text-transform: uppercase; transition: opacity 0.3s; }
    .fullscreen-btn { position: absolute; top: 16px; right: 16px; z-index: 999; background: rgba(255, 255, 255, 0.12); backdrop-filter: blur(20px); border: 1px solid rgba(255, 255, 255, 0.2); color: #ffffff; width: 38px; height: 38px; border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; transition: opacity 0.3s; }
    .fullscreen-btn svg { width: 18px; height: 18px; fill: #ffffff; }
    
    body.is-fullscreen .player-bar, body.is-fullscreen .dev-badge { display: none !important; }
    body.is-fullscreen .app-container { padding-bottom: 0 !important; }
    body.is-fullscreen .fullscreen-btn { opacity: 0.15; }
    body.is-fullscreen .fullscreen-btn:active, body.is-fullscreen .fullscreen-btn:hover { opacity: 1; }

    .retrack-btn { position: fixed; right: 1.2rem; bottom: 13rem; z-index: 99; background: rgba(255, 255, 255, 0.2); backdrop-filter: blur(15px); border: 1px solid rgba(255, 255, 255, 0.3); color: #ffffff; padding: 0.55rem 1rem; border-radius: 20px; font-size: 0.78rem; font-weight: 700; display: flex; align-items: center; gap: 0.4rem; cursor: pointer; opacity: 0; pointer-events: none; transform: translateY(10px); transition: opacity 0.3s, transform 0.3s; }
    .retrack-btn.visible { opacity: 1; pointer-events: auto; transform: translateY(0); }
    .lyrics-panel { flex: 1; height: 100%; overflow-y: auto; padding: 45vh 1.5rem 40vh 1.5rem; scrollbar-width: none; text-align: center; }
    .lyrics-panel::-webkit-scrollbar { display: none; }
    
    .line { cursor: pointer; word-break: normal; overflow-wrap: break-word; margin-bottom: 2.5rem; line-height: 1.2; transition: transform 0.4s cubic-bezier(0.25, 1, 0.5, 1), opacity 0.4s ease, filter 0.4s ease; max-width: 100%; padding: 0 0.5rem; }
    .line .word { display: inline-block; margin-right: 0.25em; transition: color 0.12s ease-out, text-shadow 0.15s ease-out, transform 0.18s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
    .line.future { opacity: 0 !important; transform: translateY(30px) scale(0.9); pointer-events: none; }
    
    /* APPLE STYLE */
    .lyrics-apple .line { font-size: clamp(2rem, 6.5vw, 3.2rem); font-weight: 800; color: rgba(255, 255, 255, 0.25); filter: blur(4px); opacity: 0.35; transform: scale(0.92); }
    .lyrics-apple .line.past { color: rgba(255, 255, 255, 0.35); filter: blur(0px); opacity: 0.45; transform: scale(0.95); }
    .lyrics-apple .line.active { opacity: 1 !important; filter: blur(0px) !important; transform: scale(1.02) translateY(0) !important; color: #ffffff; }
    .lyrics-apple .word { color: rgba(255, 255, 255, 0.3); }
    .lyrics-apple .line.active .word.filled, 
    .lyrics-apple .line.active .word.active-word { color: #ffffff; text-shadow: 0 0 25px rgba(255, 255, 255, 0.65); }

    /* DOOM TV STYLE */
    .lyrics-doom .line { font-family: 'Bebas Neue', sans-serif; font-size: clamp(2.3rem, 7.5vw, 4.2rem); letter-spacing: 1px; color: rgba(255, 255, 255, 0.18); filter: blur(4px); transform: scale(0.85) rotateX(25deg); }
    .lyrics-doom .line.past { opacity: 0.25; filter: blur(3px); transform: scale(0.9) rotateX(10deg); }
    .lyrics-doom .line.active { opacity: 1; filter: blur(0px); transform: scale(1.12) rotateX(0deg); }
    .lyrics-doom .line.active .word { color: #ffffff; text-shadow: 0 0 30px rgba(255, 255, 255, 0.7); }
    .lyrics-doom .line.active .word.active-word { color: #ffcc00; transform: scale(1.2); text-shadow: 0 0 40px #ffcc00, 0 0 10px #ffffff; }

    /* REEL HOLLOW */
    .lyrics-reel .line { font-size: clamp(2.3rem, 7.5vw, 4.2rem); font-weight: 900; letter-spacing: -1px; color: rgba(255, 255, 255, 0.25); }
    .lyrics-reel .line.past { opacity: 0.2; transform: scale(0.95); }
    .lyrics-reel .line.active { opacity: 1; transform: scale(1.02) translateY(0); }
    .lyrics-reel .line.active .word { color: transparent; -webkit-text-stroke: 1.5px rgba(255, 255, 255, 0.6); }
    .lyrics-reel .line.active .word.filled { color: rgba(255, 255, 255, 0.85); -webkit-text-stroke: 0px; }
    .lyrics-reel .line.active .word.active-word { color: #ffffff; -webkit-text-stroke: 0px; text-shadow: 0 0 25px #ffffff; transform: scale(1.15); }

    /* CAPCUT POP */
    .lyrics-capcut .line { font-family: 'Anton', sans-serif; font-size: clamp(2.2rem, 7.5vw, 4rem); text-transform: uppercase; color: rgba(255, 255, 255, 0.3); }
    .lyrics-capcut .line.past { opacity: 0.4; transform: scale(0.95); }
    .lyrics-capcut .line.active { opacity: 1; transform: scale(1) translateY(0); }
    .lyrics-capcut .line.active .word.filled { color: #ffffff; -webkit-text-stroke: 2px #000; }
    .lyrics-capcut .line.active .word.active-word { color: #ffcc00; transform: scale(1.15) rotate(-3deg); -webkit-text-stroke: 2px #000; text-shadow: 4px 4px 0 #000; z-index: 10; position: relative; }

    /* CHAOTIC EDIT STYLE */
    .lyrics-chaotic .line { font-size: clamp(2.2rem, 7vw, 3.8rem); text-transform: uppercase; color: rgba(255, 255, 255, 0.2); }
    .lyrics-chaotic .word { font-family: var(--rand-font, 'Anton'); transition: transform 0.1s cubic-bezier(0.175, 0.885, 0.32, 1.275), color 0.1s; }
    .lyrics-chaotic .line.past { opacity: 0.3; transform: scale(0.95); }
    .lyrics-chaotic .line.active { opacity: 1; transform: scale(1.02) translateY(0); }
    .lyrics-chaotic .line.active .word.filled { color: var(--rand-color, #ffffff); -webkit-text-stroke: 2px #000; text-shadow: 3px 3px 0 #000; }
    .lyrics-chaotic .line.active .word.anim-tilt-right.active-word { transform: scale(1.1) rotate(6deg); z-index: 10; position: relative; }
    .lyrics-chaotic .line.active .word.anim-tilt-left.active-word { transform: scale(1.1) rotate(-6deg); z-index: 10; position: relative; }
    .lyrics-chaotic .line.active .word.anim-jump.active-word { transform: scale(1.1) translateY(-6px); z-index: 10; position: relative; }
    .lyrics-chaotic .line.active .word.anim-drop.active-word { transform: scale(1.1) translateY(6px); z-index: 10; position: relative; }

    .lyrics-footer { margin-top: 5rem; padding-top: 1.5rem; padding-bottom: 3rem; font-size: 0.85rem; font-weight: 700; color: rgba(255, 255, 255, 0.4); border-top: 1px solid rgba(255, 255, 255, 0.1); text-align: center; }
    
    .player-bar { position: fixed; bottom: 2rem; left: 50%; transform: translateX(-50%); width: calc(100% - 1.8rem); max-width: 520px; background: rgba(30, 30, 35, 0.85); backdrop-filter: blur(35px); border: 1px solid rgba(255, 255, 255, 0.18); border-radius: 28px; padding: 0.8rem 1rem; z-index: 100; display: flex; flex-direction: column; gap: 0.6rem; transition: opacity 0.3s, transform 0.3s; box-shadow: 0 15px 35px rgba(0,0,0,0.6); }
    .live-sync-bar { display: flex; align-items: center; justify-content: space-between; background: rgba(255, 255, 255, 0.08); padding: 0.35rem 0.5rem; border-radius: 14px; border: 1px solid rgba(255, 255, 255, 0.1); }
    .sync-label { font-size: 0.72rem; font-weight: 700; color: #34c759; min-width: 65px; }
    .sync-actions { display: flex; gap: 0.25rem; overflow-x: auto; scrollbar-width: none; }
    .mini-sync-btn { background: rgba(255, 255, 255, 0.15); border: none; color: #ffffff; padding: 0.25rem 0.45rem; border-radius: 8px; font-size: 0.7rem; font-weight: 700; cursor: pointer; }
    .mini-sync-btn.vocal-btn { background: #34c759; color: #000000; }
    .player-info { display: flex; align-items: center; justify-content: space-between; }
    .track-meta { display: flex; align-items: center; gap: 0.8rem; overflow: hidden; }
    .album-art { width: 44px; height: 44px; border-radius: 12px; background: rgba(255,255,255,0.1); display: flex; align-items: center; justify-content: center; font-size: 1.3rem; flex-shrink: 0; background-size: cover; background-position: center; }
    .track-text { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .track-title { font-weight: 700; font-size: 0.95rem; }
    .track-artist { font-size: 0.8rem; opacity: 0.65; }
    .controls { display: flex; align-items: center; gap: 0.6rem; }
    .btn-icon { background: rgba(255, 255, 255, 0.1); border: 1px solid rgba(255, 255, 255, 0.15); color: #ffffff; cursor: pointer; display: flex; align-items: center; justify-content: center; width: 40px; height: 40px; border-radius: 50%; }
    .btn-play { background: #ffffff; color: #000000; border: none; }
    .btn-play svg { fill: #000000; width: 18px; height: 18px; }
    .btn-gear svg { fill: #ffffff; width: 18px; height: 18px; }
    .scrubber-box { width: 100%; display: flex; flex-direction: column; gap: 0.2rem; }
    .seek-slider { -webkit-appearance: none; width: 100%; height: 5px; border-radius: 3px; background: rgba(255, 255, 255, 0.2); }
    .seek-slider::-webkit-slider-thumb { -webkit-appearance: none; width: 13px; height: 13px; border-radius: 50%; background: #ffffff; cursor: pointer; }
    .time-labels { display: flex; justify-content: space-between; font-size: 0.7rem; font-weight: 600; opacity: 0.55; }
    
    .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.65); backdrop-filter: blur(12px); z-index: 1000; display: none; align-items: flex-end; justify-content: center; }
    .modal-overlay.open { display: flex; }
    .modal-card { width: 100%; max-width: 520px; max-height: 90vh; overflow-y: auto; background: #1c1c1e; border-radius: 28px 28px 0 0; padding: 1.5rem; position: relative; }
    .modal-close { position: absolute; top: 1.2rem; right: 1.2rem; background: rgba(255,255,255,0.1); border: none; color: #ffffff; width: 30px; height: 30px; border-radius: 50%; font-size: 1rem; cursor: pointer; }
    .modal-title { font-size: 1.2rem; font-weight: 700; margin-bottom: 1.2rem; }
    .settings-group { margin-bottom: 1.2rem; }
    .settings-group label { display: block; font-size: 0.8rem; opacity: 0.7; margin-bottom: 0.5rem; }
    .theme-row { display: flex; gap: 0.8rem; align-items: center;}
    .theme-circle { width: 34px; height: 34px; border-radius: 50%; border: 2px solid rgba(255,255,255,0.15); cursor: pointer; transition: transform 0.2s, border-color 0.2s; }
    .theme-circle.active { border-color: #ffffff; transform: scale(1.15); }
    .color-picker-wrapper { position: relative; width: 34px; height: 34px; border-radius: 50%; overflow: hidden; border: 2px solid rgba(255,255,255,0.15); cursor: pointer; background: conic-gradient(red, yellow, lime, aqua, blue, magenta, red); }
    .color-picker-wrapper input[type="color"] { position: absolute; top: -10px; left: -10px; width: 50px; height: 50px; opacity: 0; cursor: pointer; }
    .style-row { display: flex; gap: 0.6rem; overflow-x: auto; scrollbar-width: none; padding-bottom: 0.5rem; }
    .style-btn { padding: 0.65rem 1rem; border-radius: 12px; border: 1px solid rgba(255,255,255,0.15); background: rgba(255,255,255,0.05); color: #ffffff; font-weight: 600; font-size: 0.85rem; cursor: pointer; white-space: nowrap; }
    .style-btn.active { background: #ffffff; color: #000000; border-color: #ffffff; }
    .input-control { width: 100%; padding: 0.75rem 1rem; border-radius: 12px; border: 1px solid rgba(255,255,255,0.15); background: rgba(255,255,255,0.08); color: #ffffff; font-size: 0.95rem; outline: none; margin-bottom: 1rem;}
    .file-btn { width: 100%; padding: 0.85rem; border-radius: 14px; background: rgba(255,255,255,0.08); border: 1px dashed rgba(255,255,255,0.3); color: #ffffff; font-weight: 600; cursor: pointer; text-align: center; margin-bottom: 0.8rem; display: block; }
    .btn-action { width: 100%; padding: 0.85rem; border-radius: 14px; background: #ffffff; color: #000000; font-weight: 700; border: none; cursor: pointer; font-size: 1rem; }
    .btn-elrc { background: #34c759; color: #000000; margin-top: 0.5rem; }
    .status-text { font-size: 0.8rem; color: #34c759; margin-top: 0.6rem; text-align: center; min-height: 1.2em; }
  </style>
</head>
<body>

  <div class="bg-blur" id="bgBlur"></div>
  <div class="bg-rgb-overlay" id="rgbOverlay"></div>

  <div class="app-container">
    <div class="dev-badge">MADE BY CHINNU</div>
    <button class="fullscreen-btn" id="fullscreenBtn">
      <svg id="fsIcon" viewBox="0 0 24 24"><path d="M7 14H5v5h5v-2H7v-3zm-2-4h2V7h3V5H5v5zm12 7h-3v2h5v-5h-2v3zM14 5v2h3v3h2V5h-5z"/></svg>
    </button>
    <button class="retrack-btn" id="retrackBtn"><span>⬇ Track Line</span></button>

    <div class="lyrics-panel lyrics-doom" id="lyricsDisplay">
      <div class="line">Tap ⚙️ below to load audio & lyrics file!</div>
    </div>
  </div>

  <div class="player-bar">
    <div class="live-sync-bar">
      <span class="sync-label">Sync: <span id="offsetVal">0.0s</span></span>
      <div class="sync-actions">
        <button class="mini-sync-btn" id="m1">-1s</button>
        <button class="mini-sync-btn" id="m01">-0.1s</button>
        <button class="mini-sync-btn vocal-btn" id="tapSyncBtn">🎯 Start Vocals</button>
        <button class="mini-sync-btn" id="p01">+0.1s</button>
        <button class="mini-sync-btn" id="p1">+1s</button>
        <button class="mini-sync-btn" id="mReset">Reset</button>
      </div>
    </div>

    <div class="player-info">
      <div class="track-meta">
        <div class="album-art" id="playerArt">🎵</div>
        <div class="track-text">
          <div class="track-title" id="displayTitle">No Track Loaded</div>
          <div class="track-artist" id="displayArtist">Tap gear to load file</div>
        </div>
      </div>
      <div class="controls">
        <button class="btn-icon btn-play" id="playBtn"><svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg></button>
        <button class="btn-icon btn-gear" id="gearBtn"><svg viewBox="0 0 24 24"><path d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58c.18-.14.23-.41.12-.61l-1.92-3.32c-.12-.22-.37-.29-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54c-.04-.24-.24-.41-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96c-.22-.08-.47 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.05.3-.09.63-.09.94s.02.64.07.94l-2.03 1.58c-.18.14-.23.41-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6c-1.98 0-3.6-1.62-3.6-3.6s1.62-3.6 3.6-3.6 3.6 1.62 3.6 3.6-1.62 3.6-3.6-3.6z"/></svg></button>
      </div>
    </div>
    <div class="scrubber-box">
      <input type="range" class="seek-slider" id="seekSlider" min="0" max="100" value="0" step="0.1" />
      <div class="time-labels"><span id="currTime">0:00</span><span id="durTime">0:00</span></div>
    </div>
  </div>

  <audio id="audioPlayer"></audio>

  <div class="modal-overlay" id="modalOverlay">
    <div class="modal-card">
      <button class="modal-close" id="closeModalBtn">✕</button>
      <div class="modal-title">Settings</div>

      <div class="settings-group">
        <label>Theme Background</label>
        <div class="theme-row">
          <div class="theme-circle" data-bg="dynamic" style="background: linear-gradient(135deg, #a8ff78 0%, #78ffd6 100%);" title="Dynamic Art"></div>
          <div class="theme-circle" data-bg="blue" style="background: radial-gradient(circle, #0a192f 0%, #020c1b 80%);" title="Midnight Blue"></div>
          <div class="theme-circle" data-bg="black" style="background: #000000;" title="OLED Black"></div>
          <div class="color-picker-wrapper" id="rgbWrapper" title="Custom RGB Color">
            <input type="color" id="rgbPicker" value="#ff0044" />
          </div>
        </div>
      </div>

      <div class="settings-group">
        <label>Lyrics Animation Style</label>
        <div class="style-row">
          <button class="style-btn active" data-style="doom">Doom TV</button>
          <button class="style-btn" data-style="chaotic">Chaotic Edit</button>
          <button class="style-btn" data-style="capcut">CapCut Pop</button>
          <button class="style-btn" data-style="apple">Apple Style</button>
        </div>
      </div>

      <label class="file-btn" for="audioFileInput">📁 Choose Local Audio File (.mp3, .m4a)</label>
      <input type="file" id="audioFileInput" accept="audio/*" style="display:none;" />

      <label class="file-btn" for="lrcFileInput">📄 Optional: Upload Custom .LRC/.ELRC File</label>
      <input type="file" id="lrcFileInput" accept=".lrc,.elrc,.txt" style="display:none;" />

      <input type="text" class="input-control" id="trackInput" placeholder="Song Title" />
      <input type="text" class="input-control" id="artistInput" placeholder="Artist Name" />
      
      <button class="btn-action" id="searchBtn">Fetch Online Lyrics</button>
      <button class="btn-action btn-elrc" id="searchElrcBtn">🔍 Search Google for .ELRC</button>
      
      <div class="status-text" id="statusText">Choose an audio file to start.</div>
    </div>
  </div>

  <script>
    const audioPlayer = document.getElementById('audioPlayer');
    const display = document.getElementById('lyricsDisplay');
    const playBtn = document.getElementById('playBtn');
    const gearBtn = document.getElementById('gearBtn');
    const closeModalBtn = document.getElementById('closeModalBtn');
    const modalOverlay = document.getElementById('modalOverlay');
    const searchBtn = document.getElementById('searchBtn');
    const searchElrcBtn = document.getElementById('searchElrcBtn');
    const trackInput = document.getElementById('trackInput');
    const artistInput = document.getElementById('artistInput');
    const audioFileInput = document.getElementById('audioFileInput');
    const lrcFileInput = document.getElementById('lrcFileInput');
    const statusText = document.getElementById('statusText');
    const seekSlider = document.getElementById('seekSlider');
    const currTimeText = document.getElementById('currTime');
    const durTimeText = document.getElementById('durTime');
    const retrackBtn = document.getElementById('retrackBtn');
    const playerArt = document.getElementById('playerArt');
    const bgBlur = document.getElementById('bgBlur');
    const rgbOverlay = document.getElementById('rgbOverlay');
    const fullscreenBtn = document.getElementById('fullscreenBtn');
    const fsIcon = document.getElementById('fsIcon');
    
    let parsedLyrics = [];
    let lyricOffset = 0.0;
    let autoScrollEnabled = true;
    let isUserSeeking = false;
    let activeIndex = -1;
    let animationFrameId = null;
    let hasWordLevelTimestamps = false;
    let hasCustomLyricsLoaded = false; // LOCK FLAG TO PREVENT ONLINE OVERWRITE
    
    const chaoticColors = ['#ffcc00', '#ff003c', '#00e6ff', '#34c759', '#ffffff'];
    const chaoticFonts = ["'Anton', sans-serif", "'Bebas Neue', sans-serif", "'Permanent Marker', cursive", "'Space Mono', monospace"];
    const chaoticAnims = ['anim-tilt-right', 'anim-tilt-left', 'anim-jump', 'anim-drop'];

    const themeCircles = document.querySelectorAll('.theme-circle');
    const rgbWrapper = document.getElementById('rgbWrapper');
    const rgbPicker = document.getElementById('rgbPicker');
    let currentTheme = localStorage.getItem('appTheme') || 'dynamic';
    let customRgbVal = localStorage.getItem('customRgb') || '#ff0044';
    let currentDynamicImg = "none";
    rgbPicker.value = customRgbVal;

    function applyTheme(themeType) {
      themeCircles.forEach(c => c.classList.remove('active'));
      rgbWrapper.classList.remove('active');
      rgbOverlay.style.opacity = '0';

      if (themeType === 'custom') {
        rgbWrapper.classList.add('active');
        rgbOverlay.style.setProperty('--custom-color', rgbPicker.value);
        rgbOverlay.style.opacity = '0.6';
        bgBlur.style.background = '#000000';
      } else {
        const activeCircle = document.querySelector(`.theme-circle[data-bg="${themeType}"]`);
        if (activeCircle) activeCircle.classList.add('active');

        if (themeType === 'dynamic') {
           bgBlur.style.background = currentDynamicImg !== "none" ? `url('${currentDynamicImg}')` : "radial-gradient(circle, #3a1c40 0%, #0d0d11 80%)";
        } else if (themeType === 'blue') {
           bgBlur.style.background = "radial-gradient(circle, #0a192f 0%, #020c1b 80%)";
        } else if (themeType === 'black') {
           bgBlur.style.background = "#000000";
        }
      }
      bgBlur.style.backgroundSize = 'cover';
      bgBlur.style.backgroundPosition = 'center';
      localStorage.setItem('appTheme', themeType);
      currentTheme = themeType;
    }

    themeCircles.forEach(circle => circle.addEventListener('click', () => applyTheme(circle.getAttribute('data-bg'))));
    rgbPicker.addEventListener('input', (e) => { customRgbVal = e.target.value; localStorage.setItem('customRgb', customRgbVal); applyTheme('custom'); });
    applyTheme(currentTheme);

    const styleBtns = document.querySelectorAll('.style-btn');
    let currentStyle = localStorage.getItem('lyricStyle') || 'doom';
    function applyLyricStyle(styleType) {
      styleBtns.forEach(btn => btn.classList.remove('active'));
      document.querySelector(`.style-btn[data-style="${styleType}"]`).classList.add('active');
      display.className = `lyrics-panel lyrics-${styleType}`;
      localStorage.setItem('lyricStyle', styleType);
      currentStyle = styleType;
    }
    styleBtns.forEach(btn => btn.addEventListener('click', () => applyLyricStyle(btn.getAttribute('data-style'))));
    applyLyricStyle(currentStyle);

    function toggleFullscreenUI() {
      if (document.fullscreenElement || document.webkitFullscreenElement) {
        document.body.classList.add('is-fullscreen');
        fsIcon.innerHTML = '<path d="M5 16h3v3h2v-5H5v2zm3-8H5v2h5V5H8v3zm6 11h2v-3h3v-2h-5v5zm2-11V5h-2v5h5V8h-3z"/>';
      } else {
        document.body.classList.remove('is-fullscreen');
        fsIcon.innerHTML = '<path d="M7 14H5v5h5v-2H7v-3zm-2-4h2V7h3V5H5v5zm12 7h-3v2h5v-5h-2v3zM14 5v2h3v3h2V5h-5z"/>';
      }
    }
    
    document.addEventListener('fullscreenchange', toggleFullscreenUI);
    document.addEventListener('webkitfullscreenchange', toggleFullscreenUI);

    fullscreenBtn.addEventListener('click', () => {
      if (!document.fullscreenElement && !document.webkitFullscreenElement) {
        if (document.documentElement.requestFullscreen) document.documentElement.requestFullscreen();
        else if (document.documentElement.webkitRequestFullscreen) document.documentElement.webkitRequestFullscreen();
      } else {
        if (document.exitFullscreen) document.exitFullscreen();
        else if (document.webkitExitFullscreen) document.webkitExitFullscreen();
      }
    });

    const playHTML = '<svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>';
    const pauseHTML = '<svg viewBox="0 0 24 24"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>';

    audioPlayer.addEventListener('play', () => { playBtn.innerHTML = pauseHTML; start60FpsEngine(); });
    audioPlayer.addEventListener('pause', () => { playBtn.innerHTML = playHTML; cancelAnimationFrame(animationFrameId); });

    function formatTime(secs) {
      if (isNaN(secs)) return '0:00';
      const m = Math.floor(secs / 60);
      const s = Math.floor(secs % 60);
      return `${m}:${s < 10 ? '0' : ''}${s}`;
    }

    function parseLRC(lrcText) {
      hasWordLevelTimestamps = false;
      const lines = lrcText.split('\n');
      const result = [];
      const lineTimeRegex = /\[(\d{2}):(\d{2})(?:\.(\d{1,3}))?\]/;
      const wordTimeRegex = /<(\d{2}):(\d{2})(?:\.(\d{1,3}))?>\s*([^\s<]+)/g;

      for (let line of lines) {
        const match = lineTimeRegex.exec(line);
        if (match) {
          const lineTime = parseInt(match[1]) * 60 + parseInt(match[2]) + (match[3] ? parseInt(match[3].padEnd(3,'0'))/1000 : 0);
          let rawText = line.replace(lineTimeRegex, '').trim();

          const words = [];
          let wordMatch;
          
          while ((wordMatch = wordTimeRegex.exec(rawText)) !== null) {
            hasWordLevelTimestamps = true;
            const wordTime = parseInt(wordMatch[1]) * 60 + parseInt(wordMatch[2]) + (wordMatch[3] ? parseInt(wordMatch[3].padEnd(3,'0'))/1000 : 0);
            let cleanWord = wordMatch[4].replace(/["'`]/g, '');
            if (cleanWord) {
              words.push({ text: cleanWord, time: wordTime });
            }
          }

          if (words.length > 0) {
            result.push({ time: lineTime, text: words.map(w => w.text).join(' '), words: words });
          } else if (rawText) {
            result.push({ time: lineTime, text: rawText, words: null });
          }
        }
      }
      return result.sort((a, b) => a.time - b.time);
    }

    function renderLyrics() {
      display.innerHTML = '';
      if (parsedLyrics.length === 0) return display.innerHTML = '<div class="line">No lyrics loaded.</div>';

      parsedLyrics.forEach((item, index) => {
        const lineEl = document.createElement('div');
        lineEl.className = 'line future';
        lineEl.id = `line-${index}`;

        const wordList = item.words || item.text.split(' ').map(t => ({ text: t }));
        wordList.forEach((w) => {
          const wordSpan = document.createElement('span');
          wordSpan.className = 'word';
          wordSpan.innerText = w.text;
          
          wordSpan.style.setProperty('--rand-color', chaoticColors[Math.floor(Math.random() * chaoticColors.length)]);
          wordSpan.style.setProperty('--rand-font', chaoticFonts[Math.floor(Math.random() * chaoticFonts.length)]);
          wordSpan.classList.add(chaoticAnims[Math.floor(Math.random() * chaoticAnims.length)]);

          lineEl.appendChild(wordSpan);
        });

        lineEl.addEventListener('click', () => {
          audioPlayer.currentTime = Math.max(0, item.time + lyricOffset);
          audioPlayer.play();
          autoScrollEnabled = true;
        });
        display.appendChild(lineEl);
      });
    }

    function start60FpsEngine() {
      function syncLoop() {
        if (!audioPlayer.paused) {
          syncLyricsToTime();
          animationFrameId = requestAnimationFrame(syncLoop);
        }
      }
      animationFrameId = requestAnimationFrame(syncLoop);
    }

    function syncLyricsToTime() {
      const currentTime = audioPlayer.currentTime - lyricOffset;
      let newActiveIndex = -1;

      for (let i = 0; i < parsedLyrics.length; i++) {
        if (currentTime >= parsedLyrics[i].time) newActiveIndex = i;
        else break;
      }

      if (audioPlayer.duration && !isUserSeeking) {
        seekSlider.value = (audioPlayer.currentTime / audioPlayer.duration) * 100;
        currTimeText.innerText = formatTime(audioPlayer.currentTime);
        durTimeText.innerText = formatTime(audioPlayer.duration);
      }

      if (newActiveIndex === -1) return;

      const allLines = document.querySelectorAll('.line');
      
      if (newActiveIndex !== activeIndex && autoScrollEnabled) {
          activeIndex = newActiveIndex;
          const activeLineEl = document.getElementById(`line-${activeIndex}`);
          if (activeLineEl) {
              display.scrollTo({
                  top: activeLineEl.offsetTop - (display.clientHeight / 2) + (activeLineEl.clientHeight / 2),
                  behavior: 'smooth'
              });
          }
      }

      const activeLineData = parsedLyrics[newActiveIndex];

      allLines.forEach((el, index) => {
        const wordSpans = el.querySelectorAll('.word');

        if (index < newActiveIndex) {
          el.className = 'line past';
          wordSpans.forEach(w => w.classList.add('filled'));
        } else if (index === newActiveIndex) {
          el.className = 'line active';

          if (activeLineData.words) {
            activeLineData.words.forEach((wObj, wIdx) => {
              if (wordSpans[wIdx]) {
                if (currentTime >= wObj.time) {
                  const nextWord = activeLineData.words[wIdx + 1];
                  if (!nextWord || currentTime < nextWord.time) {
                    wordSpans[wIdx].classList.add('filled', 'active-word');
                  } else {
                    wordSpans[wIdx].classList.add('filled');
                    wordSpans[wIdx].classList.remove('active-word');
                  }
                } else {
                  wordSpans[wIdx].classList.remove('filled', 'active-word');
                }
              }
            });
          } else {
            const nextLineTime = parsedLyrics[newActiveIndex + 1] ? parsedLyrics[newActiveIndex + 1].time : activeLineData.time + 3.0;
            const progress = Math.min(Math.max((currentTime - activeLineData.time) / (nextLineTime - activeLineData.time), 0), 1);
            const wordsToFill = Math.floor(progress * wordSpans.length);

            wordSpans.forEach((wSpan, wIdx) => {
              wSpan.classList.remove('filled', 'active-word');
              if (wIdx < wordsToFill) wSpan.classList.add('filled');
              else if (wIdx === wordsToFill) wSpan.classList.add('filled', 'active-word');
            });
          }
        } else {
          el.className = 'line future';
          wordSpans.forEach(w => w.classList.remove('filled', 'active-word'));
        }
      });
    }

    playBtn.addEventListener('click', () => audioPlayer.paused ? (audioPlayer.src ? audioPlayer.play() : modalOverlay.classList.add('open')) : audioPlayer.pause());
    gearBtn.addEventListener('click', () => modalOverlay.classList.add('open'));
    closeModalBtn.addEventListener('click', () => modalOverlay.classList.remove('open'));
    retrackBtn.addEventListener('click', () => { autoScrollEnabled = true; retrackBtn.classList.remove('visible'); syncLyricsToTime(); });

    seekSlider.addEventListener('input', () => { isUserSeeking = true; currTimeText.innerText = formatTime((seekSlider.value / 100) * audioPlayer.duration); });
    seekSlider.addEventListener('change', () => { audioPlayer.currentTime = (seekSlider.value / 100) * audioPlayer.duration; isUserSeeking = false; });

    display.addEventListener('wheel', () => { autoScrollEnabled = false; retrackBtn.classList.add('visible'); });
    display.addEventListener('touchmove', () => { autoScrollEnabled = false; retrackBtn.classList.add('visible'); });

    audioFileInput.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (!file) return;
      hasCustomLyricsLoaded = false; // Reset lock for new audio file
      audioPlayer.src = URL.createObjectURL(file);
      
      let rawName = file.name.replace(/\.[^/.]+$/, "").replace(/[_]/g, " ").replace(/-/g, " ");
      window.jsmediatags.read(file, {
        onSuccess: function(tag) {
          const t = tag.tags;
          if (t.picture) {
            let base64String = "";
            for (let i = 0; i < t.picture.data.length; i++) base64String += String.fromCharCode(t.picture.data[i]);
            currentDynamicImg = `data:${t.picture.format};base64,${window.btoa(base64String)}`;
            playerArt.style.backgroundImage = `url('${currentDynamicImg}')`;
            playerArt.innerText = "";
            if (currentTheme === 'dynamic') applyTheme('dynamic');
          }
          applyTrackMeta(t.title || rawName, t.artist || "Local MP3");
        },
        onError: () => applyTrackMeta(rawName, "Local MP3")
      });
    });

    lrcFileInput.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = function(evt) {
          parsedLyrics = parseLRC(evt.target.result);
          hasCustomLyricsLoaded = true; // LOCK IN CUSTOM UPLOADED LYRICS SO ONLINE FETCH NEVER OVERWRITES THEM
          renderLyrics();
          modalOverlay.classList.remove('open');
          statusText.innerText = hasWordLevelTimestamps ? 'Enhanced Word-Level (.ELRC) Loaded!' : 'Custom LRC Loaded!';
        };
        reader.readAsText(file);
      }
    });

    function applyTrackMeta(title, artist) {
      document.getElementById('displayTitle').innerText = title;
      document.getElementById('displayArtist').innerText = artist;
      trackInput.value = title; artistInput.value = artist !== "Local MP3" ? artist : "";
      lyricOffset = 0; document.getElementById('offsetVal').innerText = '0.0s';
      
      const startPlayback = () => {
        durTimeText.innerText = formatTime(audioPlayer.duration);
        
        // ONLY fetch online lyrics if user hasn't already uploaded a custom .elrc file
        if (!hasCustomLyricsLoaded) {
          statusText.innerText = `Fetching lyrics...`;
          fetchOnlyLyrics(title, artist === "Local MP3" ? "" : artist);
        } else {
          statusText.innerText = `Using custom uploaded .ELRC file!`;
        }

        audioPlayer.play().catch(()=>{});
      };

      if (audioPlayer.readyState >= 1) {
        startPlayback();
      } else {
        audioPlayer.onloadedmetadata = startPlayback;
      }
    }

    async function fetchOnlyLyrics(track, artist) {
      if (hasCustomLyricsLoaded) return; // Prevent online fetch from overwriting custom lyrics
      try {
        const query = `${track} ${artist}`.trim();
        const response = await fetch(`https://lrclib.net/api/search?q=${encodeURIComponent(query)}`);
        const data = await response.json();
        
        if (hasCustomLyricsLoaded) return; // Double check after await

        for (let item of data) {
          if (item.syncedLyrics) {
            parsedLyrics = parseLRC(item.syncedLyrics);
            renderLyrics();
            modalOverlay.classList.remove('open');
            return;
          }
        }
        display.innerHTML = '<div class="line">No timed lyrics found. Upload custom .ELRC file below!</div>';
      } catch (err) { statusText.innerText = 'Error loading lyrics.'; }
    }

    searchBtn.addEventListener('click', () => {
      hasCustomLyricsLoaded = false; // Allow manual override if they hit search
      lyricOffset = 0; document.getElementById('offsetVal').innerText = '0.0s';
      fetchOnlyLyrics(trackInput.value.trim(), artistInput.value.trim());
    });

    searchElrcBtn.addEventListener('click', () => {
      const track = trackInput.value.trim();
      const artist = artistInput.value.trim();
      if (!track) {
        statusText.innerText = "Please enter a song title first!";
        return;
      }
      const searchQuery = `${track} ${artist !== "Local MP3" && artist !== "" ? artist : ""} enhanced lrc elrc download`;
      window.open(`https://www.google.com/search?q=${encodeURIComponent(searchQuery)}`, '_blank');
    });

    document.getElementById('tapSyncBtn').addEventListener('click', () => {
      if (parsedLyrics.length > 0 && audioPlayer.currentTime > 0) {
        lyricOffset = audioPlayer.currentTime - parsedLyrics[0].time;
        document.getElementById('offsetVal').innerText = `${lyricOffset >= 0 ? '+' : ''}${lyricOffset.toFixed(1)}s`;
      }
    });

    function adjust(v) { lyricOffset+=v; document.getElementById('offsetVal').innerText = `${lyricOffset >= 0 ? '+' : ''}${lyricOffset.toFixed(1)}s`; }
    document.getElementById('m1').addEventListener('click', () => adjust(-1));
    document.getElementById('m01').addEventListener('click', () => adjust(-0.1));
    document.getElementById('p01').addEventListener('click', () => adjust(0.1));
    document.getElementById('p1').addEventListener('click', () => adjust(1));
    document.getElementById('mReset').addEventListener('click', () => { lyricOffset=0; document.getElementById('offsetVal').innerText='0.0s'; });

  </script>
</body>
