<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Apple Music Lyrics Pro - Local Player</title>
  
  <link rel="manifest" href="manifest.json">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Bebas+Neue&family=Inter:wght@700;900&family=Montserrat:wght@800;900&family=Teko:wght@600&family=Permanent+Marker&family=Space+Mono:wght@700&display=swap" rel="stylesheet">
  
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jsmediatags/3.9.5/jsmediatags.min.js"></script>
  
  <style>
    :root {
      --active-color: #ffcc00;
      --text-align: center;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    body { font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", sans-serif; background: #12091f; color: #ffffff; height: 100vh; height: 100dvh; width: 100vw; overflow: hidden; display: flex; justify-content: center; align-items: center; }
    
    #visualizerCanvas {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      z-index: 2;
      pointer-events: none;
    }

    .bg-blur { position: fixed; inset: 0; width: 100vw; height: 100vh; background: #12091f; z-index: 1; transition: background 0.8s ease-in-out; background-size: cover; background-position: center; filter: blur(60px); opacity: 0.95; pointer-events: none; }
    .bg-rgb-overlay { position: fixed; inset: 0; width: 100vw; height: 100vh; z-index: 2; pointer-events: none; overflow: hidden; }
    .ambient-glow { 
      position: absolute; 
      width: 70vw; 
      height: 70vw; 
      max-width: 600px; 
      max-height: 600px; 
      border-radius: 50% !important; 
      filter: blur(80px) !important; 
      opacity: 0.6; 
      mix-blend-mode: screen; 
      pointer-events: none; 
    }
    .glow-1 { top: -20%; left: -20%; background: var(--glow-1, #3b82f6); }
    .glow-2 { bottom: -20%; right: -20%; background: var(--glow-2, #e11d48); }
    .glow-3 { top: 25%; left: 25%; background: var(--glow-3, #9333ea); }

    .app-container { position: relative; z-index: 3; display: flex; width: 100%; height: 100%; padding-bottom: 180px; transition: padding 0.3s; justify-content: center; }
    .dev-badge { position: fixed; top: 18px; left: 50%; transform: translateX(-50%); z-index: 999; font-size: 0.78rem; font-weight: 800; color: #ffffff; background: rgba(255, 255, 255, 0.12); backdrop-filter: blur(20px); border-radius: 20px; border: 1px solid rgba(255, 255, 255, 0.2); padding: 0.5rem 1.2rem; pointer-events: none; text-transform: uppercase; }
    .fullscreen-btn { position: fixed; top: 16px; right: 16px; z-index: 999; background: rgba(255, 255, 255, 0.12); backdrop-filter: blur(20px); border: 1px solid rgba(255, 255, 255, 0.2); color: #ffffff; width: 38px; height: 38px; border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; }
    .fullscreen-btn svg { width: 18px; height: 18px; fill: #ffffff; pointer-events: none; }
    
    body.is-fullscreen .player-bar, body.is-fullscreen .dev-badge { display: none !important; }
    body.is-fullscreen .app-container { padding-bottom: 0 !important; }

    .retrack-btn { position: fixed; right: 2rem; bottom: 13rem; z-index: 99; background: rgba(255, 255, 255, 0.2); backdrop-filter: blur(15px); border: 1px solid rgba(255, 255, 255, 0.3); color: #ffffff; padding: 0.55rem 1rem; border-radius: 20px; font-size: 0.78rem; font-weight: 700; display: flex; align-items: center; gap: 0.4rem; cursor: pointer; opacity: 0; pointer-events: none; transform: translateY(10px); transition: opacity 0.3s, transform 0.3s; }
    .retrack-btn.visible { opacity: 1; pointer-events: auto; transform: translateY(0); }
    
    /* LYRICS PANEL */
    .lyrics-panel { flex: 1; height: 100%; width: 100%; max-width: 900px; overflow-y: auto; padding: calc(50vh - 60px) 2rem calc(50vh + 100px) 2rem; scrollbar-width: none; text-align: var(--text-align); scroll-behavior: smooth; margin: 0 auto; }
    .lyrics-panel::-webkit-scrollbar { display: none; }
    
    .line { position: relative; margin-bottom: 1.6rem; line-height: 1.35; transition: transform 0.4s cubic-bezier(0.25, 1, 0.5, 1), opacity 0.4s ease; width: 100%; padding: 0.2rem 0.5rem; opacity: 0.25; transform: scale(0.92); cursor: pointer; text-align: var(--text-align); word-break: normal; overflow-wrap: break-word; pointer-events: auto; }
    .line .word { display: inline-block; margin: 0 0.15em; transition: color 0.15s ease, transform 0.18s cubic-bezier(0.175, 0.885, 0.32, 1.275); }

    .line.active { opacity: 1; transform: scale(1.05); }
    .line.past, .line.future { opacity: 0.25; transform: scale(0.92); }

    /* DOOM TV STYLE */
    .lyrics-doom .line { font-family: 'Teko', sans-serif; font-size: clamp(2.2rem, 5.5vw, 3.8rem); letter-spacing: 1px; color: rgba(255, 255, 255, 0.3); text-transform: uppercase; }
    .lyrics-doom .line.active .word { color: rgba(255, 255, 255, 0.4); }
    .lyrics-doom .line.active .word.filled { color: #ffffff; text-shadow: 0 0 25px rgba(255, 255, 255, 0.8); }
    .lyrics-doom .line.active .word.active-word { color: var(--active-color) !important; transform: scale(1.15); text-shadow: 0 0 35px var(--active-color), 0 0 10px #ffffff; }

    /* REEL HOLLOW STYLE */
    .lyrics-reel .line { font-family: 'Montserrat', sans-serif; font-size: clamp(2.0rem, 5vw, 3.5rem); font-weight: 900; letter-spacing: -0.5px; text-transform: uppercase; color: rgba(255, 255, 255, 0.3); }
    .lyrics-reel .line.active .word { color: transparent; -webkit-text-stroke: 1.5px rgba(255, 255, 255, 0.4); }
    .lyrics-reel .line.active .word.filled { color: #ffffff; -webkit-text-stroke: 0px; text-shadow: 0 0 20px rgba(255,255,255,0.7); }
    .lyrics-reel .line.active .word.active-word { color: var(--active-color) !important; -webkit-text-stroke: 0px; text-shadow: 0 0 25px var(--active-color); transform: scale(1.12); }

    /* CAPCUT EDIT STYLE */
    .lyrics-capcut .line { font-family: 'Montserrat', sans-serif; font-weight: 900; font-size: clamp(1.8rem, 4.5vw, 2.8rem); text-transform: uppercase; color: rgba(255, 255, 255, 0.3); letter-spacing: -0.5px; }
    .lyrics-capcut .line.active .word { color: rgba(255, 255, 255, 0.4); }
    .lyrics-capcut .line.active .word.filled { color: #ffffff; text-shadow: 0 4px 20px rgba(0, 0, 0, 0.9), 0 0 25px rgba(255, 255, 255, 0.6); }
    .lyrics-capcut .line.active .word.active-word { color: var(--active-color, #FFD000) !important; transform: scale(1.12); text-shadow: 0 0 20px rgba(255, 208, 0, 0.7), 0 4px 20px rgba(0, 0, 0, 1); }

    /* BALANCED CHAOTIC EDIT STYLE */
    .lyrics-chaotic .line { font-size: clamp(1.8rem, 5.2vw, 3.2rem); text-transform: uppercase; color: rgba(255, 255, 255, 0.25); }
    .lyrics-chaotic .word { font-family: var(--rand-font, 'Anton'); transition: color 0.15s ease, transform 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
    .lyrics-chaotic .line.active .word { color: rgba(255, 255, 255, 0.3); -webkit-text-stroke: 1px rgba(0,0,0,0.6); }
    .lyrics-chaotic .line.active .word.filled { color: var(--rand-color, #ffffff); -webkit-text-stroke: 1.5px #000; text-shadow: 2px 2px 0 #000, 0 0 12px var(--rand-color, #ffffff); }
    .lyrics-chaotic .line.active .word.active-word { transform: scale(1.15) rotate(var(--rand-deg, 4deg)); color: var(--active-color) !important; -webkit-text-stroke: 2px #000; text-shadow: 3px 3px 0 #000, 0 0 20px var(--active-color); z-index: 10; position: relative; }

    /* APPLE STYLE */
    .lyrics-apple .line { font-family: 'Inter', sans-serif; font-size: clamp(1.8rem, 4.5vw, 3.0rem); font-weight: 700; text-transform: none; letter-spacing: -0.5px; color: rgba(255, 255, 255, 0.25); filter: blur(3px); }
    .lyrics-apple .line.past { filter: blur(1.5px); opacity: 0.3; }
    .lyrics-apple .line.future { filter: blur(2px); opacity: 0.3; }
    .lyrics-apple .line.active { opacity: 1; filter: blur(0px); }
    .lyrics-apple .line.active .word { color: rgba(255, 255, 255, 0.35); }
    .lyrics-apple .line.active .word.filled { color: #ffffff; text-shadow: 0 0 25px rgba(255, 255, 255, 0.9); }
    .lyrics-apple .line.active .word.active-word { color: #ffffff !important; transform: scale(1.08); text-shadow: 0 0 35px #ffffff, 0 0 10px var(--active-color); }

    /* PLAYER BAR */
    .player-bar { position: fixed; bottom: 2rem; left: 50%; transform: translateX(-50%); width: calc(100% - 2rem); max-width: 600px; background: rgba(30, 30, 35, 0.85); backdrop-filter: blur(35px); border: 1px solid rgba(255, 255, 255, 0.18); border-radius: 28px; padding: 0.8rem 1.2rem; z-index: 100; display: flex; flex-direction: column; gap: 0.6rem; box-shadow: 0 15px 35px rgba(0,0,0,0.6); }
    .live-sync-bar { display: flex; align-items: center; justify-content: space-between; background: rgba(255, 255, 255, 0.08); padding: 0.35rem 0.6rem; border-radius: 14px; border: 1px solid rgba(255, 255, 255, 0.1); }
    .sync-label { font-size: 0.72rem; font-weight: 700; color: #34c759; min-width: 65px; }
    .sync-actions { display: flex; gap: 0.3rem; overflow-x: auto; scrollbar-width: none; }
    .mini-sync-btn { background: rgba(255, 255, 255, 0.15); border: none; color: #ffffff; padding: 0.28rem 0.5rem; border-radius: 8px; font-size: 0.72rem; font-weight: 700; cursor: pointer; }
    .mini-sync-btn.vocal-btn { background: #34c759; color: #000000; }
    .player-info { display: flex; align-items: center; justify-content: space-between; }
    .track-meta { display: flex; align-items: center; gap: 0.8rem; overflow: hidden; }
    .album-art { width: 48px; height: 48px; border-radius: 12px; background: rgba(255,255,255,0.1); display: flex; align-items: center; justify-content: center; font-size: 1.3rem; flex-shrink: 0; background-size: cover; background-position: center; border: 1px solid rgba(255,255,255,0.15); }
    .track-text { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .track-title { font-weight: 700; font-size: 0.95rem; }
    .track-artist { font-size: 0.8rem; opacity: 0.65; }
    .controls { display: flex; align-items: center; gap: 0.5rem; }
    .btn-icon { background: rgba(255, 255, 255, 0.1); border: 1px solid rgba(255, 255, 255, 0.15); color: #ffffff; cursor: pointer; display: flex; align-items: center; justify-content: center; width: 40px; height: 40px; border-radius: 50%; font-size: 1rem; }
    .btn-play { background: #ffffff; color: #000000; border: none; }
    .btn-play svg { fill: #000000; width: 18px; height: 18px; pointer-events: none; }
    .btn-gear svg { fill: #ffffff; width: 18px; height: 18px; pointer-events: none; }
    .scrubber-box { width: 100%; display: flex; flex-direction: column; gap: 0.2rem; }
    .seek-slider { -webkit-appearance: none; width: 100%; height: 5px; border-radius: 3px; background: rgba(255, 255, 255, 0.2); }
    .seek-slider::-webkit-slider-thumb { -webkit-appearance: none; width: 13px; height: 13px; border-radius: 50%; background: #ffffff; cursor: pointer; }
    .time-labels { display: flex; justify-content: space-between; font-size: 0.7rem; font-weight: 600; opacity: 0.55; }
    
    /* MODALS */
    .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.65); backdrop-filter: blur(12px); z-index: 1000; display: none; align-items: flex-end; justify-content: center; }
    .modal-overlay.open { display: flex; }
    .modal-card { width: 100%; max-width: 520px; max-height: 85vh; overflow-y: auto; background: #1c1c1e; border-radius: 28px 28px 0 0; padding: 1.5rem; position: relative; }
    .modal-close { position: absolute; top: 1.2rem; right: 1.2rem; background: rgba(255,255,255,0.1); border: none; color: #ffffff; width: 30px; height: 30px; border-radius: 50%; font-size: 1rem; cursor: pointer; }
    .modal-title { font-size: 1.2rem; font-weight: 700; margin-bottom: 1.2rem; }
    .settings-group { margin-bottom: 1.2rem; }
    .settings-group label { display: block; font-size: 0.8rem; opacity: 0.7; margin-bottom: 0.5rem; }
    .theme-row { display: flex; gap: 0.8rem; align-items: center;}
    .theme-circle { width: 34px; height: 34px; border-radius: 50%; border: 2px solid rgba(255,255,255,0.15); cursor: pointer; }
    .theme-circle.active { border-color: #ffffff; transform: scale(1.15); }
    .color-picker-wrapper { position: relative; width: 34px; height: 34px; border-radius: 50%; overflow: hidden; border: 2px solid rgba(255,255,255,0.15); cursor: pointer; background: conic-gradient(red, yellow, lime, aqua, blue, magenta, red); }
    .color-picker-wrapper input[type="color"] { position: absolute; top: -10px; left: -10px; width: 50px; height: 50px; opacity: 0; cursor: pointer; }
    .style-row { display: flex; gap: 0.6rem; overflow-x: auto; scrollbar-width: none; padding-bottom: 0.5rem; }
    .style-btn { padding: 0.65rem 1rem; border-radius: 12px; border: 1px solid rgba(255,255,255,0.15); background: rgba(255,255,255,0.05); color: #ffffff; font-weight: 600; font-size: 0.85rem; cursor: pointer; white-space: nowrap; }
    .style-btn.active { background: #ffffff; color: #000000; border-color: #ffffff; }
    
    .align-row { display: flex; gap: 0.6rem; }
    .align-btn { flex: 1; padding: 0.6rem; border-radius: 12px; border: 1px solid rgba(255,255,255,0.15); background: rgba(255,255,255,0.05); color: #ffffff; font-weight: 700; cursor: pointer; text-align: center; font-size: 0.9rem; }
    .align-btn.active { background: #ffffff; color: #000000; border-color: #ffffff; }

    /* EQUALIZER & SOUND FX UI */
    .eq-band-container { display: flex; justify-content: space-around; align-items: center; padding: 1.2rem 0; background: rgba(255, 255, 255, 0.05); border-radius: 16px; border: 1px solid rgba(255, 255, 255, 0.1); margin-bottom: 1rem; }
    .eq-band { display: flex; flex-direction: column; align-items: center; gap: 0.8rem; font-size: 0.75rem; font-weight: 700; opacity: 0.85; }
    .eq-slider { -webkit-appearance: slider-vertical; width: 8px; height: 100px; background: rgba(255, 255, 255, 0.2); border-radius: 4px; cursor: pointer; }

    .fx-card-row { display: flex; justify-content: space-between; align-items: center; background: rgba(255, 255, 255, 0.05); padding: 0.8rem 1rem; border-radius: 14px; margin-bottom: 0.8rem; border: 1px solid rgba(255,255,255,0.1); }
    .fx-title { font-size: 0.85rem; font-weight: 700; }
    .fx-slider { width: 50%; }

    .input-control { width: 100%; padding: 0.75rem 1rem; border-radius: 12px; border: 1px solid rgba(255,255,255,0.15); background: rgba(255,255,255,0.08); color: #ffffff; font-size: 0.95rem; outline: none; margin-bottom: 1rem;}
    
    .file-btn { width: 100%; padding: 0.85rem; border-radius: 14px; background: rgba(255,255,255,0.08); border: 1px dashed rgba(255,255,255,0.3); color: #ffffff; font-weight: 600; cursor: pointer; text-align: center; margin-bottom: 0.8rem; display: block; }
    .file-group { display: flex; gap: 0.5rem; margin-bottom: 0.8rem; width: 100%; }
    .file-group .file-btn { margin-bottom: 0; flex: 1; }
    .btn-remove { background: rgba(255, 59, 48, 0.15); color: #ff3b30; border: 1px solid rgba(255, 59, 48, 0.4); border-radius: 14px; padding: 0 1.2rem; font-weight: 700; cursor: pointer; display: none; }
    
    .btn-action { width: 100%; padding: 0.85rem; border-radius: 14px; background: #ffffff; color: #000000; font-weight: 700; border: none; cursor: pointer; font-size: 1rem; }
    .btn-elrc { background: #34c759; color: #000000; margin-top: 0.5rem; }
    .status-text { font-size: 0.8rem; color: #34c759; margin-top: 0.6rem; text-align: center; min-height: 1.2em; }
  </style>
</head>
<body>

  <canvas id="visualizerCanvas"></canvas>

  <div class="bg-blur" id="bgBlur"></div>
  <div class="bg-rgb-overlay" id="rgbOverlay">
    <div class="ambient-glow glow-1" id="glow1"></div>
    <div class="ambient-glow glow-2" id="glow2"></div>
    <div class="ambient-glow glow-3" id="glow3"></div>
  </div>

  <div class="app-container">
    <div class="dev-badge">MADE BY CHINNU</div>
    <button class="fullscreen-btn" id="fullscreenBtn">
      <svg id="fsIcon" viewBox="0 0 24 24"><path d="M7 14H5v5h5v-2H7v-3zm-2-4h2V7h3V5H5v5zm12 7h-3v2h5v-5h-2v3zM14 5v2h3v3h2V5h-5z"/></svg>
    </button>
    <button class="retrack-btn" id="retrackBtn"><span>⬇ Track Line</span></button>

    <div class="lyrics-panel lyrics-chaotic" id="lyricsDisplay">
      <div class="line active">Tap ⚙️ below to load audio & lyrics file!</div>
    </div>
  </div>

  <div class="player-bar">
    <div class="live-sync-bar">
      <span class="sync-label">Sync: <span id="offsetVal">0.0s</span></span>
      <div class="sync-actions">
        <button class="mini-sync-btn" id="m1">-1s</button>
        <button class="mini-sync-btn" id="m01">-0.1s</button>
        <button class="mini-sync-btn vocal-btn" id="tapSyncBtn">🎯 Start Vocals</button>
        <button class="mini-sync-btn" id="p01">+0.1s</button>
        <button class="mini-sync-btn" id="p1">+1s</button>
        <button class="mini-sync-btn" id="mReset">Reset</button>
      </div>
    </div>

    <div class="player-info">
      <div class="track-meta">
        <div class="album-art" id="playerArt">🎵</div>
        <div class="track-text">
          <div class="track-title" id="displayTitle">No Track Loaded</div>
          <div class="track-artist" id="displayArtist">Tap gear to load file</div>
        </div>
      </div>
      <div class="controls">
        <button class="btn-icon" id="eqBtn" title="Sound FX & Spatial Audio">🎛️</button>
        <button class="btn-icon btn-play" id="playBtn"><svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg></button>
        <button class="btn-icon btn-gear" id="gearBtn"><svg viewBox="0 0 24 24"><path d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58c.18-.14.23-.41.12-.61l-1.92-3.32c-.12-.22-.37-.29-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54c-.04-.24-.24-.41-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96c-.22-.08-.47 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.05.3-.09.63-.09.94s.02.64.07.94l-2.03 1.58c-.18.14-.23.41-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6c-1.98 0-3.6-1.62-3.6-3.6s1.62-3.6 3.6-3.6 3.6 1.62 3.6 3.6-1.62 3.6-3.6-3.6z"/></svg></button>
      </div>
    </div>
    <div class="scrubber-box">
      <input type="range" class="seek-slider" id="seekSlider" min="0" max="100" value="0" step="0.1" />
      <div class="time-labels"><span id="currTime">0:00</span><span id="durTime">0:00</span></div>
    </div>
  </div>

  <audio id="audioPlayer"></audio>

  <!-- OVERLAY MODAL WRAPPER -->
  <div class="modal-overlay" id="modalOverlay">
    
    <!-- SETTINGS CARD -->
    <div class="modal-card" id="settingsCard" style="display: none;">
      <button class="modal-close" id="closeModalBtn">✕</button>
      <div class="modal-title">Settings</div>

      <div class="settings-group">
        <label>Text Alignment Position</label>
        <div class="align-row">
          <button class="align-btn" data-align="left">Left ⬅</button>
          <button class="align-btn active" data-align="center">Center ⏹</button>
          <button class="align-btn" data-align="right">Right ➡</button>
        </div>
      </div>

      <div class="settings-group">
        <label>Theme Background & Corner Glow</label>
        <div class="theme-row">
          <div class="theme-circle" data-bg="dynamic" style="background: linear-gradient(135deg, #a8ff78 0%, #78ffd6 100%);" title="Dynamic Art"></div>
          <div class="theme-circle" data-bg="blue" style="background: radial-gradient(circle, #0a192f 0%, #020c1b 80%);" title="Midnight Blue"></div>
          <div class="theme-circle" data-bg="black" style="background: #12091f;" title="OLED Black"></div>
          <div class="theme-circle" data-bg="random" style="background: conic-gradient(cyan, magenta, yellow, cyan);" title="Random Colors"></div>
          <div class="color-picker-wrapper" id="rgbWrapper" title="Custom RGB Color">
            <input type="color" id="rgbPicker" value="#ff0044" />
          </div>
        </div>
      </div>

      <div class="settings-group">
        <label>Lyrics Animation Style</label>
        <div class="style-row">
          <button class="style-btn" data-style="doom">Doom TV</button>
          <button class="style-btn" data-style="reel">Reel Style</button>
          <button class="style-btn active" data-style="chaotic">Chaotic Edit</button>
          <button class="style-btn" data-style="capcut">CapCut Pop</button>
          <button class="style-btn" data-style="apple">Apple Style</button>
        </div>
      </div>

      <div class="settings-group">
        <label>Active Word Highlight Color</label>
        <div class="theme-row">
          <div class="color-picker-wrapper" title="Pick Accent Color" style="background: conic-gradient(red, yellow, lime, aqua, blue, magenta, red);">
            <input type="color" id="wordColorPicker" value="#ffcc00" />
          </div>
        </div>
      </div>

      <label class="file-btn" for="audioFileInput" id="audioBtnLabel">📁 Choose Local Audio File (.mp3, .m4a)</label>
      <input type="file" id="audioFileInput" accept="audio/*" style="display:none;" />

      <div class="file-group">
        <label class="file-btn" for="lrcFileInput" id="lrcBtnLabel">📄 Upload Custom .ELRC</label>

  <script>
    if ('serviceWorker' in navigator) {

    const audioPlayer = document.getElementById('audioPlayer');

    const lrcBtnLabel = document.getElementById('lrcBtnLabel');

    const rgbPicker = document.getElementById('rgbPicker');
    const wordColorPicker = document.getElementById('wordColorPicker');
    const fullscreenBtn = document.getElementById('fullscreenBtn');
    const fsIcon = document.getElementById('fsIcon');
    
    let parsedLyrics = [];
    let lyricOffset = 0.0;
    let autoScrollEnabled = true;
    let isUserSeeking = false;
    let activeIndex = -1;
    let animationFrameId = null;
    let hasWordLevelTimestamps = false;
    let hasCustomLyricsLoaded = false;
    
    const chaoticColors = ['#ffcc00', '#ff003c', '#00e6ff', '#34c759', '#ff00ff', '#00ffff'];
    const chaoticFonts = ["'Anton', sans-serif", "'Bebas Neue', sans-serif", "'Permanent Marker', cursive", "'Space Mono', monospace"];

    const themeCircles = document.querySelectorAll('.theme-circle');
    let currentTheme = localStorage.getItem('appTheme') || 'dynamic';
    let customRgbVal = localStorage.getItem('customRgb') || '#ff0044';
    let customWordColor = localStorage.getItem('wordColor') || '#ffcc00';
    let currentTextAlign = localStorage.getItem('textAlign') || 'center';
    let currentDynamicImg = "none";
    
    rgbPicker.value = customRgbVal;
    wordColorPicker.value = customWordColor;
    document.documentElement.style.setProperty('--active-color', customWordColor);
    document.documentElement.style.setProperty('--text-align', currentTextAlign);

    // WEB AUDIO API CHAIN (VISUALIZER + EQ + 3D SPATIAL HRTF)
    const canvas = document.getElementById('visualizerCanvas');
    const ctx = canvas.getContext('2d');
    let audioCtx, analyser, srcNode, dataArray;
    let bassFilter, pannerNode, spatialNode, eqBands = {};
    let isAudioEngineInit = false;

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    function initAudioEngine() {
      if (isAudioEngineInit) return;
      try {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        analyser = audioCtx.createAnalyser();
        analyser.fftSize = 128;

        srcNode = audioCtx.createMediaElementSource(audioPlayer);

        // 1. Bass Boost Node
        bassFilter = audioCtx.createBiquadFilter();
        bassFilter.type = "lowshelf";
        bassFilter.frequency.value = 150;
        bassFilter.gain.value = 0;

        // 2. 3D Spatial HRTF Panner Node
        spatialNode = audioCtx.createPanner();
        spatialNode.panningModel = 'HRTF';
        spatialNode.distanceModel = 'inverse';
        spatialNode.positionZ.value = 0;

        // 3. Stereo Panner Node
        pannerNode = audioCtx.createStereoPanner ? audioCtx.createStereoPanner() : null;

        // 4. EQ Nodes
        const freqs = [60, 250, 1000, 4000, 12000];
        let previousNode = srcNode;

        previousNode.connect(bassFilter);
        previousNode = bassFilter;

        freqs.forEach(freq => {
          const eq = audioCtx.createBiquadFilter();
          eq.type = "peaking";
          eq.frequency.value = freq;
          eq.Q.value = 1.0;
          eq.gain.value = 0;

          previousNode.connect(eq);
          previousNode = eq;
          eqBands[freq] = eq;
        });

        if (pannerNode) {
          previousNode.connect(pannerNode);
          previousNode = pannerNode;
        }

        previousNode.connect(spatialNode);
        spatialNode.connect(analyser);
        analyser.connect(audioCtx.destination);

        dataArray = new Uint8Array(analyser.frequencyBinCount);
        isAudioEngineInit = true;
      } catch (e) { console.warn("Audio Context init:", e); }
    }

    function drawVisualizer() {
      requestAnimationFrame(drawVisualizer);
      if (!isAudioEngineInit || audioPlayer.paused) {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        return;
      }

      analyser.getByteFrequencyData(dataArray);
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      const bufferLength = dataArray.length;
      const barWidth = (canvas.width / bufferLength) * 1.4;
      let x = 0;

      for (let i = 0; i < bufferLength; i++) {
        const barHeight = (dataArray[i] / 255) * (canvas.height * 0.32);

        ctx.fillStyle = `rgba(255, 204, 0, 0.4)`;
        ctx.shadowBlur = 12;
        ctx.shadowColor = `rgba(255, 204, 0, 0.8)`;

        ctx.fillRect(x, canvas.height - barHeight, barWidth - 4, barHeight);
        x += barWidth;
      }
    }

    const alignBtns = document.querySelectorAll('.align-btn');
    function applyTextAlign(alignVal) {
      alignBtns.forEach(btn => btn.classList.remove('active'));

        if (themeType === 'dynamic') {
           bgBlur.style.background = currentDynamicImg !== "none" ? `url('${currentDynamicImg}')` : "#1a0b2e";

        } else if (themeType === 'blue') {

    themeCircles.forEach(circle => circle.addEventListener('click', () => applyTheme(circle.getAttribute('data-bg'))));

    function toggleFullscreenUI() {

    const playHTML = '<svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>';
    const pauseHTML = '<svg viewBox="0 0 24 24"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>';

    audioPlayer.addEventListener('play', () => { 
      playBtn.innerHTML = pauseHTML;

    function formatTime(secs) {
      if (isNaN(secs)) return '0:00';
      const m = Math.floor(secs / 60);
      const s = Math.floor(secs % 60);
      return `${m}:${s < 10 ? '0' : ''}${s}`;
    }

    function parseLRC(lrcText) {
      hasWordLevelTimestamps = false;
      const lines = lrcText.split('\n');
      const rawResult = [];
      const lineTimeRegex = /\[(\d{2}):(\d{2})(?:\.(\d{1,3}))?\]/;

      for (let line of lines) {
        const match = lineTimeRegex.exec(line);
        if (match) {
          const lineTime = parseInt(match[1]) * 60 + parseInt(match[2]) + (match[3] ? parseInt(match[3].padEnd(3,'0'))/1000 : 0);
          let rawText = line.replace(lineTimeRegex, '').replace(/\[.*?\]|\(.*?\)/g, '').trim().replace(/["'`]/g, '');

          if (!rawText) continue;

          if (/<(\d{2}):(\d{2})(?:\.(\d{1,3}))?>/.test(rawText)) {
            hasWordLevelTimestamps = true;
            let reg = /<(\d{2}):(\d{2})(?:\.(\d{1,3}))?>/g;
            let m;
            let lastPos = 0;
            let currentTime = lineTime;
            let allWords = [];

            while ((m = reg.exec(rawText)) !== null) {
              let textBefore = rawText.substring(lastPos, m.index).trim();
              if (textBefore) {
                textBefore.split(/\s+/).forEach(w => allWords.push({text: w, time: currentTime}));
              }
              currentTime = parseInt(m[1]) * 60 + parseInt(m[2]) + (m[3] ? parseInt(m[3].padEnd(3,'0'))/1000 : 0);
              lastPos = reg.lastIndex;
            }
            let textRemaining = rawText.substring(lastPos).trim();
            if (textRemaining) {
              textRemaining.split(/\s+/).forEach(w => allWords.push({text: w, time: currentTime}));
            }

            if (allWords.length > 0) {
              rawResult.push({ time: lineTime, text: allWords.map(w=>w.text).join(' '), words: allWords });
            }
          } else {
            rawResult.push({ time: lineTime, text: rawText, words: null });
          }
        }
      }

      rawResult.sort((a, b) => a.time - b.time);

      for (let i = 0; i < rawResult.length; i++) {
        let item = rawResult[i];
        if (!item.words) {
          const nextTime = rawResult[i + 1] ? rawResult[i + 1].time : item.time + 4.0;
          const lineDuration = Math.min(2.2, Math.max(1.0, nextTime - item.time));
          const wordArray = item.text.split(/\s+/);
          const step = lineDuration / wordArray.length;

          item.words = wordArray.map((w, idx) => ({
            text: w,
            time: item.time + (idx * step)
          }));
        }
      }

      return rawResult;
    }

    function parseEmbeddedSYLT(arrayBuffer) {
      const view = new DataView(arrayBuffer);
      if (view.byteLength < 10) return null;

      if (String.fromCharCode(view.getUint8(0), view.getUint8(1), view.getUint8(2)) !== 'ID3') return null;

      const version = view.getUint8(3);
      let offset = 10;
      const totalSize = ((view.getUint8(6) & 0x7f) << 21) | ((view.getUint8(7) & 0x7f) << 14) | ((view.getUint8(8) & 0x7f) << 7) | (view.getUint8(9) & 0x7f);

      while (offset < totalSize + 10 && offset + 10 < view.byteLength) {
        let frameId = "";
        for (let i = 0; i < 4; i++) frameId += String.fromCharCode(view.getUint8(offset + i));

        let frameSize = version === 4 ? 
          ((view.getUint8(offset + 4) & 0x7f) << 21) | ((view.getUint8(offset + 5) & 0x7f) << 14) | ((view.getUint8(offset + 6) & 0x7f) << 7) | (view.getUint8(offset + 7) & 0x7f) : 
          view.getUint32(offset + 4, false);

        if (!frameId.trim() || frameSize <= 0) break;

        if (frameId === "SYLT") {
          try {
            let p = offset + 10 + 6;
            while (p < offset + 10 + frameSize) {
              if (view.getUint8(p++) === 0) break;
            }

            const syltWords = [];
            while (p < offset + 10 + frameSize - 4) {
              let textChunk = "";
              while (p < offset + 10 + frameSize - 4) {
                let b = view.getUint8(p++);
                if (b === 0 || b === 0x0A || b === 0x0D) break;
                if (b >= 32) textChunk += String.fromCharCode(b);
              }
              textChunk = textChunk.trim();
              const timeMs = view.getUint32(p, false); p += 4;
              if (textChunk && !isNaN(timeMs)) syltWords.push({ text: textChunk, time: timeMs / 1000.0 });
            }

            if (syltWords.length > 0) {
              syltWords.sort((a, b) => a.time - b.time);
              const groupedLines = [];
              let currentLine = { time: syltWords[0].time, text: "", words: [] };

              syltWords.forEach((w) => {
                if (currentLine.words.length > 0 && (w.time - currentLine.words[currentLine.words.length - 1].time > 2.5)) {
                  currentLine.text = currentLine.words.map(item => item.text).join(" ");
                  groupedLines.push(currentLine);
                  currentLine = { time: w.time, text: "", words: [] };
                }
                currentLine.words.push(w);
              });

              if (currentLine.words.length > 0) {
                currentLine.text = currentLine.words.map(item => item.text).join(" ");
                groupedLines.push(currentLine);
              }

              return { lines: groupedLines, count: syltWords.length };
            }
          } catch (e) {}
        }
        offset += 10 + frameSize;
      }
      return null;
    }

    function renderLyrics() {
      display.innerHTML = '';
      if (parsedLyrics.length === 0) return display.innerHTML = '<div class="line active">No lyrics loaded.</div>';

      parsedLyrics.forEach((item, index) => {
        const lineEl = document.createElement('div');
        lineEl.className = 'line';
        lineEl.id = `line-${index}`;

        item.words.forEach((w) => {
          const wordSpan = document.createElement('span');
          wordSpan.className = 'word';
          wordSpan.innerText = w.text;
          
          const randColor = chaoticColors[Math.floor(Math.random() * chaoticColors.length)];
          const randFont = chaoticFonts[Math.floor(Math.random() * chaoticFonts.length)];
          const randDeg = (Math.random() > 0.5 ? 1 : -1) * (Math.floor(Math.random() * 6) + 2);

          wordSpan.style.setProperty('--rand-color', randColor);
          wordSpan.style.setProperty('--rand-font', randFont);
          wordSpan.style.setProperty('--rand-deg', `${randDeg}deg`);

          lineEl.appendChild(wordSpan);
        });

        lineEl.addEventListener('click', () => {
          audioPlayer.currentTime = Math.max(0, item.time + lyricOffset);
          audioPlayer.play();
          autoScrollEnabled = true;
        });
        display.appendChild(lineEl);
      });
    }

    function start60FpsEngine() {
      function syncLoop() {
        if (!audioPlayer.paused) {
          syncLyricsToTime();
          animationFrameId = requestAnimationFrame(syncLoop);
        }
      }
      animationFrameId = requestAnimationFrame(syncLoop);
    }

    function syncLyricsToTime() {
      const currentTime = audioPlayer.currentTime - lyricOffset;
      let newActiveIndex = -1;

      for (let i = 0; i < parsedLyrics.length; i++) {
        if (currentTime >= parsedLyrics[i].time) newActiveIndex = i;
        else break;
      }

      if (audioPlayer.duration && !isUserSeeking) {
        seekSlider.value = (audioPlayer.currentTime / audioPlayer.duration) * 100;
        currTimeText.innerText = formatTime(audioPlayer.currentTime);
        durTimeText.innerText = formatTime(audioPlayer.duration);
      }

      if (newActiveIndex === -1) return;

      if (newActiveIndex !== activeIndex && autoScrollEnabled) {
          activeIndex = newActiveIndex;
          const activeLineEl = document.getElementById(`line-${activeIndex}`);
          if (activeLineEl) {
              display.scrollTo({
                  top: activeLineEl.offsetTop - (display.clientHeight / 2) + (activeLineEl.clientHeight / 2),
                  behavior: 'smooth'
              });
          }
      }

      const activeLineData = parsedLyrics[newActiveIndex];
      const allLines = document.querySelectorAll('.line');

      allLines.forEach((el, index) => {
        const wordSpans = el.querySelectorAll('.word');

        if (index < newActiveIndex) {
          el.className = 'line past';
          wordSpans.forEach(w => w.classList.remove('filled', 'active-word'));
        } else if (index === newActiveIndex) {
          el.className = 'line active';

          let activeTime = -1;
          activeLineData.words.forEach(w => { if (currentTime >= w.time) activeTime = w.time; });

          wordSpans.forEach((wSpan, wIdx) => {
            let wObj = activeLineData.words[wIdx];
            if (currentTime >= wObj.time) {
              if (wObj.time === activeTime) wSpan.classList.add('filled', 'active-word');
              else { wSpan.classList.add('filled'); wSpan.classList.remove('active-word'); }
            } else { wSpan.classList.remove('filled', 'active-word'); }
          });
        } else {
          el.className = 'line future';
          wordSpans.forEach(w => w.classList.remove('filled', 'active-word'));
        }
      });
    }

    playBtn.addEventListener('click', () => {
      if (audioPlayer.paused) {
        if (audioPlayer.src) audioPlayer.play();
        else {
          settingsCard.style.display = 'block';
          eqCard.style.display = 'none';
          modalOverlay.classList.add('open');
        }
      } else audioPlayer.pause();
    });

    gearBtn.addEventListener('click', () => {
      settingsCard.style.display = 'block';
      eqCard.style.display = 'none';
      modalOverlay.classList.add('open');
    });

    eqBtn.addEventListener('click', () => {
      settingsCard.style.display = 'none';
      eqCard.style.display = 'block';
      modalOverlay.classList.add('open');
    });

    closeModalBtn.addEventListener('click', () => modalOverlay.classList.remove('open'));
    closeEqBtn.addEventListener('click', () => modalOverlay.classList.remove('open'));
    
    display.addEventListener('wheel', () => { autoScrollEnabled = false; retrackBtn.classList.add('visible'); });
    display.addEventListener('touchmove', () => { autoScrollEnabled = false; retrackBtn.classList.add('visible'); });
    retrackBtn.addEventListener('click', () => { autoScrollEnabled = true; retrackBtn.classList.remove('visible'); syncLyricsToTime(); });

    seekSlider.addEventListener('input', () => { isUserSeeking = true; currTimeText.innerText = formatTime((seekSlider.value / 100) * audioPlayer.duration); });
    seekSlider.addEventListener('change', () => { audioPlayer.currentTime = (seekSlider.value / 100) * audioPlayer.duration; isUserSeeking = false; });

    removeLrcBtn.addEventListener('click', () => {
      hasCustomLyricsLoaded = false;
      lrcFileInput.value = '';
      lrcBtnLabel.innerText = '📄 Upload Custom .ELRC';
      removeLrcBtn.style.display = 'none';
      statusText.innerText = '🗑️ Custom lyrics cleared.';
      fetchOnlyLyrics(trackInput.value.trim(), artistInput.value.trim());
    });

    audioFileInput.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (!file) return;
      
      hasCustomLyricsLoaded = false;
      lrcFileInput.value = '';
      lrcBtnLabel.innerText = '📄 Upload Custom .ELRC';
      removeLrcBtn.style.display = 'none';

      audioPlayer.src = URL.createObjectURL(file);
      audioBtnLabel.innerText = `✅ Audio Loaded: ${file.name}`;
      statusText.innerText = `✅ Audio loaded successfully! Ready.`;
      
      let rawName = file.name.replace(/\.[^/.]+$/, "").replace(/[_]/g, " ").replace(/-/g, " ");

      playerArt.style.backgroundImage = 'none';
      playerArt.innerText = '🎵';
      currentDynamicImg = "none";
      if (currentTheme === 'dynamic') applyTheme('dynamic');

      const reader = new FileReader();
      reader.onload = function(evt) {
        const syltData = parseEmbeddedSYLT(evt.target.result);
        if (syltData && syltData.lines && syltData.lines.length > 0) {
          parsedLyrics = syltData.lines;
          hasWordLevelTimestamps = true;
          hasCustomLyricsLoaded = true;
          renderLyrics();
          statusText.innerText = `🔥 Found ${syltData.count} synced words directly inside this MP3!`;
        }
      };
      reader.readAsArrayBuffer(file.slice(0, 131072));

      if (window.jsmediatags) {
        window.jsmediatags.read(file, {
          onSuccess: function(tag) {
            const t = tag.tags;
            if (t.picture) {
              const picture = t.picture;
              let base64String = "";
              for (let i = 0; i < picture.data.length; i++) base64String += String.fromCharCode(picture.data[i]);
              const base64 = "data:" + picture.format + ";base64," + window.btoa(base64String);
              currentDynamicImg = base64;
              playerArt.style.backgroundImage = `url('${base64}')`;
              playerArt.innerText = "";
              if (currentTheme === 'dynamic') applyTheme('dynamic');
            }
            applyTrackMeta(t.title || rawName, t.artist || "Local MP3");
          },
          onError: function() { applyTrackMeta(rawName, "Local MP3"); }
        });
      } else { applyTrackMeta(rawName, "Local MP3"); }
    });

    lrcFileInput.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = function(evt) {
          parsedLyrics = parseLRC(evt.target.result);
          hasCustomLyricsLoaded = true;
          removeLrcBtn.style.display = 'block';
          renderLyrics();
          
          lrcBtnLabel.innerText = `✅ Loaded: ${file.name}`;
          statusText.innerText = hasWordLevelTimestamps ? '✅ Enhanced Word-Level (.ELRC) Loaded & Locked!' : '✅ Custom LRC Loaded & Locked!';
          modalOverlay.classList.remove('open');
        };
        reader.readAsText(file);
      }
    });

    function applyTrackMeta(title, artist) {
      document.getElementById('displayTitle').innerText = title;
      document.getElementById('displayArtist').innerText = artist;
      trackInput.value = title; artistInput.value = artist !== "Local MP3" ? artist : "";
      lyricOffset = 0; document.getElementById('offsetVal').innerText = '0.0s';
      
      const startPlayback = () => {
        durTimeText.innerText = formatTime(audioPlayer.duration);
        if (!hasCustomLyricsLoaded) {
          statusText.innerText = `Fetching online lyrics...`;
          fetchOnlyLyrics(title, artist === "Local MP3" ? "" : artist);
        } else { statusText.innerText = `Using custom uploaded .ELRC file!`; }
        audioPlayer.play().catch(()=>{});
      };

      if (audioPlayer.readyState >= 1) startPlayback();
      else audioPlayer.onloadedmetadata = startPlayback;
    }

    async function fetchOnlyLyrics(track, artist) {
      if (hasCustomLyricsLoaded) return;
      try {
        const query = `${track} ${artist}`.trim();
        const response = await fetch(`https://lrclib.net/api/search?q=${encodeURIComponent(query)}`);
        const data = await response.json();
        if (hasCustomLyricsLoaded) return;

        for (let item of data) {
          if (item.syncedLyrics) {
            parsedLyrics = parseLRC(item.syncedLyrics);
            renderLyrics();
            modalOverlay.classList.remove('open');
            statusText.innerText = '✅ Online Synced Lyrics Loaded!';
            return;
          }
        }

        for (let item of data) {
          if (item.plainLyrics) {
            const lines = item.plainLyrics.split('\n').filter(l => l.trim().length > 0);
            parsedLyrics = lines.map((line, i) => ({ time: i * 3.5, text: line, words: null }));
            renderLyrics();
            modalOverlay.classList.remove('open');
            statusText.innerText = '⚠️ Plain lyrics loaded (No word timestamps).';
            return;
          }
        }

        display.innerHTML = '<div class="line active">No online lyrics found. Upload custom .ELRC file!</div>';
        statusText.innerText = '⚠️ No lyrics found on LRCLIB.';
      } catch (err) { statusText.innerText = 'Error loading lyrics.'; }
    }

    searchBtn.addEventListener('click', () => {
      hasCustomLyricsLoaded = false;
      lrcFileInput.value = ''; lrcBtnLabel.innerText = '📄 Upload Custom .ELRC';
      removeLrcBtn.style.display = 'none';
      lyricOffset = 0; document.getElementById('offsetVal').innerText = '0.0s';
      fetchOnlyLyrics(trackInput.value.trim(), artistInput.value.trim());
    });

    searchElrcBtn.addEventListener('click', () => {
      const track = trackInput.value.trim();
      const artist = artistInput.value.trim();
      if (!track) { statusText.innerText = "Please enter a song title first!"; return; }
      const searchQuery = `${track} ${artist !== "Local MP3" && artist !== "" ? artist : ""} enhanced lrc elrc download`;
      window.open(`https://www.google.com/search?q=${encodeURIComponent(searchQuery)}`, '_blank');
    });

    document.getElementById('tapSyncBtn').addEventListener('click', () => {
      if (parsedLyrics.length > 0 && audioPlayer.currentTime > 0) {
        lyricOffset = audioPlayer.currentTime - parsedLyrics[0].time;
        document.getElementById('offsetVal').innerText = `${lyricOffset >= 0 ? '+' : ''}${lyricOffset.toFixed(1)}s`;
      }
    });

    function adjust(v) { lyricOffset+=v; document.getElementById('offsetVal').innerText = `${lyricOffset >= 0 ? '+' : ''}${lyricOffset.toFixed(1)}s`; }
    document.getElementById('m1').addEventListener('click', () => adjust(-1));
    document.getElementById('m01').addEventListener('click', () => adjust(-0.1));
    document.getElementById('p01').addEventListener('click', () => adjust(0.1));
    document.getElementById('p1').addEventListener('click', () => adjust(1));
    document.getElementById('mReset').addEventListener('click', () => { lyricOffset=0; document.getElementById('offsetVal').innerText='0.0s'; });

    // SOUND FX & SPATIAL AUDIO LISTENERS
    document.getElementById('spatialSlider').addEventListener('input', (e) => {
      if (spatialNode) spatialNode.positionZ.value = -parseFloat(e.target.value);
    });

    document.getElementById('pannerSlider').addEventListener('input', (e) => {
      if (pannerNode && pannerNode.pan) pannerNode.pan.value = parseFloat(e.target.value);
    });

    document.getElementById('bassBoostSlider').addEventListener('input', (e) => {
      if (bassFilter) bassFilter.gain.value = parseFloat(e.target.value);
    });

    const bandMap = { eq60: 60, eq250: 250, eq1k: 1000, eq4k: 4000, eq12k: 12000 };
    Object.keys(bandMap).forEach(id => {
      document.getElementById(id).addEventListener('input', (e) => {
        const freq = bandMap[id];
        if (eqBands[freq]) eqBands[freq].gain.value = parseFloat(e.target.value);
      });
    });

    document.getElementById('resetEqBtn').addEventListener('click', () => {
      document.getElementById('bassBoostSlider').value = 0;
      document.getElementById('spatialSlider').value = 0;
      document.getElementById('pannerSlider').value = 0;
      if (bassFilter) bassFilter.gain.value = 0;
      if (spatialNode) spatialNode.positionZ.value = 0;
      if (pannerNode && pannerNode.pan) pannerNode.pan.value = 0;

      Object.keys(bandMap).forEach(id => {
        document.getElementById(id).value = 0;
        const freq = bandMap[id];
        if (eqBands[freq]) eqBands[freq].gain.value = 0;
      });
    });

  </script>
</body>
</html>
