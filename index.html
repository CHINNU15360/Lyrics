<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Apple Music Lyrics Pro - Local Player</title>

  <link rel="manifest" href="manifest.json">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Bebas+Neue&family=Inter:wght@700;900&family=Montserrat:wght@800;900&family=Teko:wght@600&family=Permanent+Marker&family=Space+Mono:wght@700&display=swap" rel="stylesheet">

  <script src="https://cdnjs.cloudflare.com/ajax/libs/jsmediatags/3.9.5/jsmediatags.min.js"></script>

  <style>
    :root {
      --active-color: #ffcc00;
      --text-align: center;
      --bar-bg: rgba(30, 30, 35, 0.85);
      --bar-border: rgba(255, 255, 255, 0.18);
      --btn-bg: rgba(255, 255, 255, 0.1);
      --btn-border: rgba(255, 255, 255, 0.15);
      --card-bg: #1c1c1e;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", sans-serif;
      background: #12091f;
      color: #ffffff;
      height: 100vh;
      height: 100dvh;
      width: 100vw;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .bg-blur {
      position: fixed; inset: 0;
      width: 100vw; height: 100vh;
      background: #12091f;
      z-index: 1;
      transition: background 0.8s ease-in-out;
      background-size: cover;
      background-position: center;
      filter: blur(60px);
      opacity: 0.95;
      pointer-events: none;
    }

    .bg-rgb-overlay {
      position: fixed; inset: 0;
      width: 100vw; height: 100vh;
      z-index: 2;
      pointer-events: none;
      overflow: hidden;
    }

    .ambient-glow {
      position: absolute;
      width: 70vw; height: 70vw;
      max-width: 600px; max-height: 600px;
      border-radius: 50% !important;
      filter: blur(80px) !important;
      opacity: 0.6;
      mix-blend-mode: screen;
      pointer-events: none;
    }

    .glow-1 { top: -20%; left: -20%; background: var(--glow-1, #3b82f6); }
    .glow-2 { bottom: -20%; right: -20%; background: var(--glow-2, #e11d48); }
    .glow-3 { top: 25%; left: 25%; background: var(--glow-3, #9333ea); }

    .app-container {
      position: relative; z-index: 3;
      display: flex;
      width: 100%; height: 100%;
      padding-bottom: 180px;
      transition: padding 0.3s;
      justify-content: center;
    }

    body.is-fullscreen .app-container { padding-bottom: 0 !important; }
    body.is-fullscreen .player-bar,
    body.is-fullscreen .dev-badge { display: none !important; }

    .dev-badge {
      position: fixed; top: 18px; left: 50%;
      transform: translateX(-50%); z-index: 999;
      font-size: 0.78rem; font-weight: 800;
      color: #ffffff;
      background: rgba(255, 255, 255, 0.12);
      backdrop-filter: blur(20px);
      border-radius: 20px;
      border: 1px solid rgba(255, 255, 255, 0.2);
      padding: 0.5rem 1.2rem;
      pointer-events: none;
      text-transform: uppercase;
    }

    .fullscreen-btn {
      position: fixed; top: 16px; right: 16px; z-index: 999;
      background: rgba(255, 255, 255, 0.12);
      backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: #ffffff;
      width: 38px; height: 38px;
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer;
      transition: background 0.2s, transform 0.2s;
    }
    .fullscreen-btn:hover { background: rgba(255, 255, 255, 0.25); transform: scale(1.08); }
    .fullscreen-btn svg { width: 18px; height: 18px; fill: #ffffff; pointer-events: none; }

    .retrack-btn {
      position: fixed; right: 2rem; bottom: 13rem; z-index: 99;
      background: rgba(255, 255, 255, 0.2);
      backdrop-filter: blur(15px);
      border: 1px solid rgba(255, 255, 255, 0.3);
      color: #ffffff;
      padding: 0.55rem 1rem;
      border-radius: 20px;
      font-size: 0.78rem; font-weight: 700;
      display: flex; align-items: center; gap: 0.4rem;
      cursor: pointer;
      opacity: 0; pointer-events: none;
      transform: translateY(10px);
      transition: opacity 0.3s, transform 0.3s;
    }
    .retrack-btn.visible { opacity: 1; pointer-events: auto; transform: translateY(0); }

    .lyrics-panel {
      flex: 1; height: 100%; width: 100%;
      max-width: 900px;
      overflow-y: auto;
      padding: calc(50vh - 60px) 2rem calc(50vh + 100px) 2rem;
      scrollbar-width: none;
      text-align: var(--text-align);
      scroll-behavior: smooth;
    }
    .lyrics-panel::-webkit-scrollbar { display: none; }

    .line {
      position: relative;
      margin-bottom: 1.6rem;
      line-height: 1.35;
      transition: transform 0.3s ease, opacity 0.3s ease;
      width: 100%;
      padding: 0.2rem 0.5rem;
      opacity: 0.25;
      transform: scale(0.95);
      cursor: pointer;
      text-align: var(--text-align);
      word-break: normal;
      overflow-wrap: break-word;
      pointer-events: auto;
    }

    .line .word {
      display: inline-block;
      margin: 0 0.15em;
      transition: color 0.1s ease, transform 0.15s ease;
      text-transform: uppercase;
    }

    .line.active { opacity: 1; transform: scale(1.05); }
    .line.past, .line.future { opacity: 0.25; transform: scale(0.95); }

    /* Doom TV Style */
    .lyrics-doom .line {
      font-family: 'Teko', sans-serif;
      font-size: clamp(2.2rem, 5.5vw, 3.8rem);
      letter-spacing: 1px;
      color: rgba(255, 255, 255, 0.3);
    }
    .lyrics-doom .line.active .word { color: rgba(255, 255, 255, 0.4); }
    .lyrics-doom .line.active .word.filled { color: #ffffff; text-shadow: 0 0 25px rgba(255, 255, 255, 0.8); }
    .lyrics-doom .line.active .word.active-word { color: var(--active-color) !important; transform: scale(1.15); text-shadow: 0 0 35px var(--active-color), 0 0 10px #ffffff; }

    /* Reel Hollow Style */
    .lyrics-reel .line {
      font-family: 'Montserrat', sans-serif;
      font-size: clamp(2.0rem, 5vw, 3.5rem);
      font-weight: 900;
      letter-spacing: -0.5px;
      color: rgba(255, 255, 255, 0.3);
    }
    .lyrics-reel .line.active .word { color: transparent; -webkit-text-stroke: 1.5px rgba(255, 255, 255, 0.4); }
    .lyrics-reel .line.active .word.filled { color: #ffffff; -webkit-text-stroke: 0px; text-shadow: 0 0 20px rgba(255,255,255,0.7); }
    .lyrics-reel .line.active .word.active-word { color: var(--active-color) !important; -webkit-text-stroke: 0px; text-shadow: 0 0 25px var(--active-color); transform: scale(1.12); }

    /* CapCut Edit Style */
    .lyrics-capcut .line {
      font-family: 'Montserrat', sans-serif;
      font-weight: 900;
      font-size: clamp(1.8rem, 4.5vw, 2.8rem);
      color: rgba(255, 255, 255, 0.3);
      letter-spacing: -0.5px;
    }
    .lyrics-capcut .line.active .word { color: rgba(255, 255, 255, 0.4); }
    .lyrics-capcut .line.active .word.filled { color: #ffffff; text-shadow: 0 4px 20px rgba(0, 0, 0, 0.9), 0 0 25px rgba(255, 255, 255, 0.6); }
    .lyrics-capcut .line.active .word.active-word { color: var(--active-color, #FFD000) !important; transform: scale(1.12); text-shadow: 0 0 20px rgba(255, 208, 0, 0.7), 0 4px 20px rgba(0, 0, 0, 1); }

    /* Chaotic Edit Style */
    .lyrics-chaotic .line {
      font-size: clamp(1.8rem, 5.2vw, 3.2rem);
      color: rgba(255, 255, 255, 0.25);
    }
    .lyrics-chaotic .word {
      font-family: var(--rand-font, 'Anton');
      transition: color 0.15s ease, transform 0.2s ease;
    }
    .lyrics-chaotic .line.active .word { color: rgba(255, 255, 255, 0.3); -webkit-text-stroke: 1px rgba(0,0,0,0.6); }
    .lyrics-chaotic .line.active .word.filled { color: var(--rand-color, #ffffff); -webkit-text-stroke: 1.5px #000; text-shadow: 2px 2px 0 #000, 0 0 12px var(--rand-color, #ffffff); }
    .lyrics-chaotic .line.active .word.active-word { transform: scale(1.15) rotate(var(--rand-deg, 4deg)); color: var(--active-color) !important; -webkit-text-stroke: 2px #000; text-shadow: 3px 3px 0 #000, 0 0 20px var(--active-color); z-index: 10; position: relative; }

    /* Apple Style */
    .lyrics-apple .line {
      font-family: 'Inter', sans-serif;
      font-size: clamp(1.8rem, 4.5vw, 3.0rem);
      font-weight: 700;
      text-transform: none;
      letter-spacing: -0.5px;
      color: rgba(255, 255, 255, 0.25);
      filter: blur(2px);
    }
    .lyrics-apple .line .word { text-transform: none; }
    .lyrics-apple .line.past { filter: blur(1.5px); opacity: 0.3; }
    .lyrics-apple .line.future { filter: blur(2px); opacity: 0.3; }
    .lyrics-apple .line.active { opacity: 1; filter: blur(0px); }
    .lyrics-apple .line.active .word { color: rgba(255, 255, 255, 0.35); }
    .lyrics-apple .line.active .word.filled { color: #ffffff; text-shadow: 0 0 25px rgba(255, 255, 255, 0.9); }
    .lyrics-apple .line.active .word.active-word { color: #ffffff !important; transform: scale(1.08); text-shadow: 0 0 35px #ffffff, 0 0 10px var(--active-color); }

    .player-bar {
      position: fixed; bottom: 2rem; left: 50%;
      transform: translateX(-50%);
      width: calc(100% - 2rem); max-width: 600px;
      background: var(--bar-bg);
      backdrop-filter: blur(35px);
      border: 1px solid var(--bar-border);
      border-radius: 28px;
      padding: 0.8rem 1.2rem;
      z-index: 100;
      display: flex; flex-direction: column; gap: 0.6rem;
      box-shadow: 0 15px 35px rgba(0,0,0,0.6);
    }

    .live-sync-bar {
      display: flex; align-items: center; justify-content: space-between;
      background: rgba(255, 255, 255, 0.08);
      padding: 0.35rem 0.6rem;
      border-radius: 14px;
      border: 1px solid rgba(255, 255, 255, 0.1);
    }
    .sync-label { font-size: 0.72rem; font-weight: 700; color: #34c759; min-width: 65px; }
    .sync-actions { display: flex; gap: 0.3rem; overflow-x: auto; scrollbar-width: none; }

    .mini-sync-btn {
      background: rgba(255, 255, 255, 0.15);
      border: none; color: #ffffff;
      padding: 0.28rem 0.5rem;
      border-radius: 8px;
      font-size: 0.72rem; font-weight: 700;
      cursor: pointer;
      transition: background 0.15s;
    }
    .mini-sync-btn:hover { background: rgba(255, 255, 255, 0.28); }
    .mini-sync-btn:active { transform: scale(0.95); }
    .mini-sync-btn.vocal-btn { background: #34c759; color: #000000; }
    .mini-sync-btn.vocal-btn:hover { background: #2db84d; }

    .player-info { display: flex; align-items: center; justify-content: space-between; }
    .track-meta { display: flex; align-items: center; gap: 0.8rem; overflow: hidden; }

    .album-art {
      width: 48px; height: 48px; border-radius: 12px;
      background: rgba(255,255,255,0.1);
      display: flex; align-items: center; justify-content: center;
      font-size: 1.3rem; flex-shrink: 0;
      background-size: cover; background-position: center;
      border: 1px solid rgba(255,255,255,0.15);
      transition: border-color 0.3s;
    }

    .track-text { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .track-title { font-weight: 700; font-size: 0.95rem; }
    .track-artist { font-size: 0.8rem; opacity: 0.65; }

    .controls { display: flex; align-items: center; gap: 0.5rem; }

    .btn-icon {
      background: var(--btn-bg);
      border: 1px solid var(--btn-border);
      color: #ffffff;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      width: 40px; height: 40px;
      border-radius: 50%;
      font-size: 1rem;
      transition: background 0.15s, transform 0.15s;
    }
    .btn-icon:hover { background: rgba(255, 255, 255, 0.2); transform: scale(1.05); }
    .btn-icon:active { transform: scale(0.95); }
    .btn-icon svg { fill: #ffffff; pointer-events: none; }

    .btn-play { background: #ffffff; color: #000000; border: none; }
    .btn-play:hover { background: #f0f0f0; }
    .btn-play svg { fill: #000000; }

    .scrubber-box { width: 100%; display: flex; flex-direction: column; gap: 0.2rem; }

    .seek-slider {
      -webkit-appearance: none;
      width: 100%; height: 5px;
      border-radius: 3px;
      background: rgba(255, 255, 255, 0.2);
      cursor: pointer;
      position: relative;
    }
    .seek-slider::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 13px; height: 13px;
      border-radius: 50%;
      background: #ffffff;
      cursor: pointer;
      box-shadow: 0 0 6px rgba(0,0,0,0.3);
      transition: transform 0.15s;
    }
    .seek-slider:hover::-webkit-slider-thumb { transform: scale(1.3); }

    .time-labels { display: flex; justify-content: space-between; font-size: 0.7rem; font-weight: 600; opacity: 0.55; }

    .modal-overlay {
      position: fixed; inset: 0;
      background: rgba(0,0,0,0.65);
      backdrop-filter: blur(12px);
      z-index: 1000;
      display: none;
      align-items: flex-end; justify-content: center;
    }
    .modal-overlay.open { display: flex; }

    .modal-card {
      width: 100%; max-width: 520px; max-height: 85vh;
      overflow-y: auto;
      background: var(--card-bg);
      border-radius: 28px 28px 0 0;
      padding: 1.5rem;
      position: relative;
    }

    .modal-close {
      position: absolute; top: 1.2rem; right: 1.2rem;
      background: rgba(255,255,255,0.1);
      border: none; color: #ffffff;
      width: 30px; height: 30px;
      border-radius: 50%;
      font-size: 1rem; cursor: pointer;
      transition: background 0.15s;
    }
    .modal-close:hover { background: rgba(255,255,255,0.2); }

    .modal-title { font-size: 1.2rem; font-weight: 700; margin-bottom: 1.2rem; }
    .settings-group { margin-bottom: 1.2rem; }
    .settings-group label { display: block; font-size: 0.8rem; opacity: 0.7; margin-bottom: 0.5rem; }

    .theme-row { display: flex; gap: 0.8rem; align-items: center; }
    .theme-circle {
      width: 34px; height: 34px; border-radius: 50%;
      border: 2px solid rgba(255,255,255,0.15);
      cursor: pointer;
      transition: border-color 0.2s, transform 0.2s;
    }
    .theme-circle:hover { transform: scale(1.1); }
    .theme-circle.active { border-color: #ffffff; transform: scale(1.15); }

    .color-picker-wrapper {
      position: relative;
      width: 34px; height: 34px; border-radius: 50%;
      overflow: hidden;
      border: 2px solid rgba(255,255,255,0.15);
      cursor: pointer;
      background: conic-gradient(red, yellow, lime, aqua, blue, magenta, red);
    }
    .color-picker-wrapper input[type="color"] {
      position: absolute; top: -10px; left: -10px;
      width: 50px; height: 50px;
      opacity: 0; cursor: pointer;
    }

    .style-row { display: flex; gap: 0.6rem; overflow-x: auto; scrollbar-width: none; padding-bottom: 0.5rem; }
    .style-btn {
      padding: 0.65rem 1rem;
      border-radius: 12px;
      border: 1px solid rgba(255,255,255,0.15);
      background: rgba(255,255,255,0.05);
      color: #ffffff; font-weight: 600; font-size: 0.85rem;
      cursor: pointer; white-space: nowrap;
      transition: background 0.15s, transform 0.15s;
    }
    .style-btn:hover { background: rgba(255,255,255,0.12); }
    .style-btn.active { background: #ffffff; color: #000000; border-color: #ffffff; }

    .align-row { display: flex; gap: 0.6rem; }
    .align-btn {
      flex: 1; padding: 0.6rem;
      border-radius: 12px;
      border: 1px solid rgba(255,255,255,0.15);
      background: rgba(255,255,255,0.05);
      color: #ffffff; font-weight: 700;
      cursor: pointer; text-align: center; font-size: 0.9rem;
      transition: background 0.15s, transform 0.15s;
    }
    .align-btn:hover { background: rgba(255,255,255,0.12); }
    .align-btn.active { background: #ffffff; color: #000000; border-color: #ffffff; }

    .eq-band-container {
      display: flex; justify-content: space-around; align-items: center;
      padding: 1.2rem 0;
      background: rgba(255, 255, 255, 0.05);
      border-radius: 16px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      margin-bottom: 1rem;
    }
    .eq-band {
      display: flex; flex-direction: column; align-items: center;
      gap: 0.8rem; font-size: 0.75rem; font-weight: 700; opacity: 0.85;
    }
    .eq-slider {
      -webkit-appearance: slider-vertical;
      width: 8px; height: 100px;
      background: rgba(255, 255, 255, 0.2);
      border-radius: 4px; cursor: pointer;
    }

    .fx-card-row {
      display: flex; justify-content: space-between; align-items: center;
      background: rgba(255, 255, 255, 0.05);
      padding: 0.8rem 1rem;
      border-radius: 14px;
      margin-bottom: 0.8rem;
      border: 1px solid rgba(255,255,255,0.1);
    }
    .fx-title { font-size: 0.85rem; font-weight: 700; }
    .fx-slider { width: 50%; }

    .input-control {
      width: 100%;
      padding: 0.75rem 1rem;
      border-radius: 12px;
      border: 1px solid rgba(255,255,255,0.15);
      background: rgba(255,255,255,0.08);
      color: #ffffff; font-size: 0.95rem;
      outline: none;
      margin-bottom: 1rem;
      transition: border-color 0.2s;
    }
    .input-control:focus { border-color: rgba(255,255,255,0.4); }

    .file-btn {
      width: 100%;
      padding: 0.85rem;
      border-radius: 14px;
      background: rgba(255,255,255,0.08);
      border: 1px dashed rgba(255,255,255,0.3);
      color: #ffffff; font-weight: 600;
      cursor: pointer; text-align: center;
      margin-bottom: 0.8rem;
      display: block;
      transition: background 0.15s;
    }
    .file-btn:hover { background: rgba(255,255,255,0.14); }

    .file-group { display: flex; gap: 0.5rem; margin-bottom: 0.8rem; width: 100%; }
    .file-group .file-btn { margin-bottom: 0; flex: 1; }

    .btn-remove {
      background: rgba(255, 59, 48, 0.15);
      color: #ff3b30;
      border: 1px solid rgba(255, 59, 48, 0.4);
      border-radius: 14px;
      padding: 0 1.2rem; font-weight: 700;
      cursor: pointer;
      display: none;
      transition: background 0.15s;
    }

    .btn-action {
      width: 100%;
      padding: 0.85rem;
      border-radius: 14px;
      background: #ffffff; color: #000000;
      font-weight: 700; border: none;
      cursor: pointer; font-size: 1rem;
      transition: background 0.15s, transform 0.15s;
    }
    .btn-action:hover { background: #f0f0f0; }
    .btn-action.btn-elrc { background: #34c759; color: #000000; margin-top: 0.5rem; }

    .status-text {
      font-size: 0.8rem;
      color: #34c759;
      margin-top: 0.6rem;
      text-align: center;
      min-height: 1.2em;
    }

    .search-results {
      max-height: 200px;
      overflow-y: auto;
      scrollbar-width: none;
      margin-bottom: 1rem;
      border-radius: 14px;
      border: 1px solid rgba(255,255,255,0.1);
      background: rgba(255,255,255,0.05);
      display: none;
    }
    .search-results.visible { display: block; }

    .search-result-item {
      padding: 0.75rem 1rem;
      border-bottom: 1px solid rgba(255,255,255,0.06);
      cursor: pointer;
      transition: background 0.15s;
    }
    .search-result-item:hover { background: rgba(255,255,255,0.08); }
    .result-title { font-size: 0.9rem; font-weight: 700; }
    .result-artist { font-size: 0.78rem; opacity: 0.6; }

    .visualizer-wrap {
      position: fixed; bottom: 0; left: 0; right: 0;
      height: 110px; z-index: 2;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.4s ease;
    }
    .visualizer-wrap.active { opacity: 1; }
    #visualizerCanvas { width: 100%; height: 100%; display: block; }

    .playlist-card { display: none; }
    .playlist-list { max-height: 230px; overflow-y: auto; margin: 0.5rem 0; scrollbar-width: none; }
    .playlist-item {
      display: flex; align-items: center; gap: 0.6rem;
      padding: 0.6rem 0.7rem; border-radius: 10px;
      background: rgba(255,255,255,0.05);
      margin-bottom: 0.4rem; cursor: pointer;
      border: 1px solid transparent;
    }
    .playlist-item.active { border-color: rgba(255,255,255,0.45); background: rgba(255,255,255,0.12); }
    .playlist-num { font-size: 0.72rem; opacity: 0.5; width: 22px; text-align: right; }
    .playlist-title { font-size: 0.84rem; font-weight: 600; }
    .playlist-artist { font-size: 0.7rem; opacity: 0.55; }
    .playlist-remove { margin-left: auto; background: none; border: none; color: #ff3b30; cursor: pointer; }
    .playlist-empty { font-size: 0.8rem; opacity: 0.5; text-align: center; padding: 1.2rem 0; }

    .source-row { display: flex; gap: 0.4rem; flex-wrap: wrap; }
    .source-btn {
      flex: 1; min-width: 80px; padding: 0.55rem 0.4rem;
      border-radius: 10px; border: 1px solid rgba(255,255,255,0.15);
      background: rgba(255,255,255,0.05); color: #fff;
      font-size: 0.76rem; font-weight: 600; cursor: pointer;
    }
    .source-btn.active { background: #fff; color: #000; }

    .io-row { display: flex; gap: 0.5rem; }
    .io-btn {
      flex: 1; padding: 0.6rem; border-radius: 10px;
      border: 1px solid rgba(255,255,255,0.15);
      background: rgba(255,255,255,0.05); color: #fff;
      font-size: 0.8rem; font-weight: 600; cursor: pointer;
    }
    .io-btn.active { background: #fff; color: #000; }
  </style>
</head>

  <script>
    'use strict';

    const audioPlayer = document.getElementById('audioPlayer');
    const display = document.getElementById('lyricsDisplay');
    const playBtn = document.getElementById('playBtn');
    const gearBtn = document.getElementById('gearBtn');
    const eqBtn = document.getElementById('eqBtn');
    const closeModalBtn = document.getElementById('closeModalBtn');
    const closeEqBtn = document.getElementById('closeEqBtn');
    const closePlaylistBtn = document.getElementById('closePlaylistBtn');
    const modalOverlay = document.getElementById('modalOverlay');
    const settingsCard = document.getElementById('settingsCard');
    const eqCard = document.getElementById('eqCard');
    const playlistCard = document.getElementById('playlistCard');
    const playlistList = document.getElementById('playlistList');
    const playlistEmpty = document.getElementById('playlistEmpty');
    const playlistFileInput = document.getElementById('playlistFileInput');
    const playlistBtn = document.getElementById('playlistBtn');
    const clearPlaylistBtn = document.getElementById('clearPlaylistBtn');
    const autoAdvanceToggle = document.getElementById('autoAdvanceToggle');
    const searchBtn = document.getElementById('searchBtn');
    const searchElrcBtn = document.getElementById('searchElrcBtn');
    const searchResults = document.getElementById('searchResults');
    const romanizeBtn = document.getElementById('romanizeBtn');
    const romanizeStatus = document.getElementById('romanizeStatus');
    const trackInput = document.getElementById('trackInput');
    const artistInput = document.getElementById('artistInput');
    const audioFileInput = document.getElementById('audioFileInput');
    const lrcFileInput = document.getElementById('lrcFileInput');
    const removeLrcBtn = document.getElementById('removeLrcBtn');
    const audioBtnLabel = document.getElementById('audioBtnLabel');
    const lrcBtnLabel = document.getElementById('lrcBtnLabel');
    const statusText = document.getElementById('statusText');
    const seekSlider = document.getElementById('seekSlider');
    const currTimeText = document.getElementById('currTime');
    const durTimeText = document.getElementById('durTime');
    const retrackBtn = document.getElementById('retrackBtn');
    const playerArt = document.getElementById('playerArt');
    const bgBlur = document.getElementById('bgBlur');
    const glow1 = document.getElementById('glow1');
    const glow2 = document.getElementById('glow2');
    const glow3 = document.getElementById('glow3');
    const rgbWrapper = document.getElementById('rgbWrapper');
    const rgbPicker = document.getElementById('rgbPicker');
    const wordColorPicker = document.getElementById('wordColorPicker');
    const fullscreenBtn = document.getElementById('fullscreenBtn');
    const fsIcon = document.getElementById('fsIcon');
    const tapSyncBtn = document.getElementById('tapSyncBtn');
    const offsetVal = document.getElementById('offsetVal');
    const displayTitle = document.getElementById('displayTitle');
    const displayArtist = document.getElementById('displayArtist');

    let parsedLyrics = [];
    let lyricOffset = 0.0;
    let autoScrollEnabled = true;
    let isUserSeeking = false;
    let activeIndex = -1;
    let hasWordLevelTimestamps = false;
    let hasCustomLyricsLoaded = false;
    let isRomanizeEnabled = localStorage.getItem('romanize') === 'true';

    let playlist = [];
    let playlistIndex = -1;
    let autoAdvance = true;
    let visualizerEnabled = localStorage.getItem('visualizer') === 'true';
    let lyricsSource = localStorage.getItem('lyricsSource') || 'lrclib';

    let currentTheme = localStorage.getItem('appTheme') || 'dynamic';
    let currentStyle = localStorage.getItem('lyricStyle') || 'chaotic';
    let currentTextAlign = localStorage.getItem('textAlign') || 'center';
    let customRgbVal = localStorage.getItem('customRgb') || '#ff0044';
    let customWordColor = localStorage.getItem('wordColor') || '#ffcc00';
    let currentDynamicImg = 'none';

    const chaoticColors = ['#ffcc00', '#ff003c', '#00e6ff', '#34c759', '#ff00ff', '#00ffff'];
    const chaoticFonts = ["'Anton', sans-serif", "'Bebas Neue', sans-serif", "'Permanent Marker', cursive", "'Space Mono', monospace"];

    let audioCtx, srcNode, bassFilter, pannerNode, spatialNode, analyserNode;
    let eqBands = {};
    let isAudioEngineInit = false;

    function formatTime(secs) {
      if (isNaN(secs)) return '0:00';
      const m = Math.floor(secs / 60);
      const s = Math.floor(secs % 60);
      return `${m}:${s < 10 ? '0' : ''}${s}`;
    }

    function getRandomColor() {
      return '#' + Math.floor(Math.random() * 16777215).toString(16).padStart(6, '0');
    }

    function debounce(fn, delay) {
      let timer;
      return (...args) => {
        clearTimeout(timer);
        timer = setTimeout(() => fn(...args), delay);
      };
    }

    function drawVisualizer() {
      if (!visualizerEnabled || !analyserNode) return;
      const canvas = document.getElementById('visualizerCanvas');
      const ctx = canvas.getContext('2d');
      const dpr = window.devicePixelRatio || 1;
      const w = canvas.clientWidth, h = canvas.clientHeight;
      if (w === 0 || h === 0) {
        requestAnimationFrame(drawVisualizer);
        return;
      }
      canvas.width = w * dpr;
      canvas.height = h * dpr;
      ctx.scale(dpr, dpr);

      const bufferLength = analyserNode.frequencyBinCount;
      const datas = new Uint8Array(bufferLength);
      analyserNode.getByteFrequencyData(datas);

      ctx.clearRect(0, 0, w, h);
      const bars = 48;
      const step = Math.floor(bufferLength / bars);
      const barW = w / bars;
      for (let i = 0; i < bars; i++) {
        const v = datas[i * step] / 255;
        const bh = Math.max(2, v * h);
        const hue = 200 + (i / bars) * 160;
        ctx.fillStyle = `hsl(${hue}, 85%, 55%)`;
        ctx.fillRect(i * barW, h - bh, barW - 1, bh);
      }
      requestAnimationFrame(drawVisualizer);
    }

    function setVisualizer(on) {
      visualizerEnabled = on;
      localStorage.setItem('visualizer', String(on));
      document.getElementById('visualizerWrap').classList.toggle('active', on);
      if (on) drawVisualizer();
    }

    function addPlaylistFiles(files) {
      files.forEach(file => {
        const url = URL.createObjectURL(file);
        const rawName = file.name.replace(/\.[^/.]+$/, '').replace(/[_-]/g, ' ');
        playlist.push({ file, name: file.name, title: rawName, artist: 'Local MP3', url });
      });
      renderPlaylist();
      if (playlistIndex === -1 && playlist.length > 0) playPlaylistIndex(0);
    }

    function renderPlaylist() {
      playlistList.innerHTML = '';
      if (playlist.length === 0) {
        playlistEmpty.style.display = 'block';
        return;
      }
      playlistEmpty.style.display = 'none';
      playlist.forEach((item, i) => {
        const div = document.createElement('div');
        div.className = 'playlist-item' + (i === playlistIndex ? ' active' : '');
        div.innerHTML = `
          <span class="playlist-num">${i + 1}</span>
          <div style="flex:1; min-width:0;">
            <div class="playlist-title">${item.title}</div>
            <div class="playlist-artist">${item.artist}</div>
          </div>
          <button class="playlist-remove" title="Remove">✕</button>
        `;
        div.addEventListener('click', e => {
          if (e.target.classList.contains('playlist-remove')) return;
          playPlaylistIndex(i);
        });
        div.querySelector('.playlist-remove').addEventListener('click', e => {
          e.stopPropagation();
          removePlaylistIndex(i);
        });
        playlistList.appendChild(div);
      });
    }

    function removePlaylistIndex(i) {
      const wasPlaying = (playlistIndex === i);
      playlist.splice(i, 1);
      if (playlist.length === 0) {
        playlistIndex = -1;
        audioPlayer.pause();
        audioPlayer.removeAttribute('src');
        audioPlayer.load();
        renderPlaylist();
        return;
      }
      if (wasPlaying) {
        playlistIndex = Math.min(i, playlist.length - 1);
        playPlaylistIndex(playlistIndex);
      } else if (playlistIndex >= playlist.length) {
        playlistIndex = playlist.length - 1;
      }
      renderPlaylist();
    }

    function playPlaylistIndex(i) {
      if (i < 0 || i >= playlist.length) return;
      playlistIndex = i;
      const item = playlist[i];
      hasCustomLyricsLoaded = false;
      lrcFileInput.value = '';
      removeLrcBtn.style.display = 'none';
      audioPlayer.src = item.url;
      playerArt.style.backgroundImage = 'none';
      playerArt.textContent = '🎵';
      currentDynamicImg = 'none';
      if (currentTheme === 'dynamic') applyTheme('dynamic');
      renderPlaylist();
      applyTrackMeta(item.title, item.artist);
    }

    function updateAutoAdvanceBtn() {
      autoAdvanceToggle.textContent = autoAdvance ? '▶ Auto-Play Next' : '■ Auto-Play Off';
      autoAdvanceToggle.classList.toggle('active', autoAdvance);
    }

    function initAudioEngine() {
      if (isAudioEngineInit) return;
      try {
        const AudioContextClass = window.AudioContext || window.webkitAudioContext;
        if (!AudioContextClass) return;
        audioCtx = new AudioContextClass();
        srcNode = audioCtx.createMediaElementSource(audioPlayer);

        bassFilter = audioCtx.createBiquadFilter();
        bassFilter.type = 'lowshelf';
        bassFilter.frequency.value = 150;
        bassFilter.gain.value = 0;

        spatialNode = audioCtx.createDelay();
        spatialNode.delayTime.value = 0;

        pannerNode = audioCtx.createStereoPanner ? audioCtx.createStereoPanner() : null;

        const freqs = [60, 250, 1000, 4000, 12000];
        let previousNode = srcNode;

        previousNode.connect(bassFilter);
        previousNode = bassFilter;

        freqs.forEach(freq => {
          const eq = audioCtx.createBiquadFilter();
          eq.type = 'peaking';
          eq.frequency.value = freq;
          eq.Q.value = 1.0;
          eq.gain.value = 0;
          previousNode.connect(eq);
          previousNode = eq;
          eqBands[freq] = eq;
        });

        if (pannerNode) {
          previousNode.connect(pannerNode);
          previousNode = pannerNode;
        }

        analyserNode = audioCtx.createAnalyser();
        analyserNode.fftSize = 256;
        previousNode.connect(analyserNode);
        analyserNode.connect(spatialNode);
        spatialNode.connect(audioCtx.destination);

        isAudioEngineInit = true;
      } catch (e) {
        console.warn('Audio Context init prevented/failed:', e);
      }
    }

    function syncLyricsToTime() {
      if (!audioPlayer.duration) return;
      const currentTime = audioPlayer.currentTime - lyricOffset;
      let newActiveIndex = -1;

      for (let i = 0; i < parsedLyrics.length; i++) {
        if (currentTime >= parsedLyrics[i].time) newActiveIndex = i;
        else break;
      }

      if (!isUserSeeking) {
        seekSlider.value = (audioPlayer.currentTime / audioPlayer.duration) * 100;
        currTimeText.textContent = formatTime(audioPlayer.currentTime);
        durTimeText.textContent = formatTime(audioPlayer.duration);
      }

      if (newActiveIndex === -1) return;

      if (newActiveIndex !== activeIndex) {
        const prevActive = document.getElementById(`line-${activeIndex}`);
        if (prevActive) {
          prevActive.className = newActiveIndex > activeIndex ? 'line past' : 'line future';
        }
        activeIndex = newActiveIndex;
        const currentActive = document.getElementById(`line-${activeIndex}`);
        if (currentActive) {
          currentActive.className = 'line active';
          if (autoScrollEnabled) {
            display.scrollTo({
              top: currentActive.offsetTop - (display.clientHeight / 2) + (currentActive.clientHeight / 2),
              behavior: 'smooth'
            });
          }
        }
      }

      const activeLineEl = document.getElementById(`line-${newActiveIndex}`);
      if (!activeLineEl) return;

      const activeLineData = parsedLyrics[newActiveIndex];
      const wordSpans = activeLineEl.querySelectorAll('.word');

      let activeWordTime = -1;
      if (activeLineData && activeLineData.words) {
        activeLineData.words.forEach(w => {
          if (currentTime >= w.time) activeWordTime = w.time;
        });

        wordSpans.forEach((wSpan, wIdx) => {
          const wObj = activeLineData.words[wIdx];
          if (!wObj) return;
          if (currentTime >= wObj.time) {
            if (wObj.time === activeWordTime) {
              wSpan.classList.add('filled', 'active-word');
            } else {
              wSpan.classList.add('filled');
              wSpan.classList.remove('active-word');
            }
          } else {
            wSpan.classList.remove('filled', 'active-word');
          }
        });
      }
    }

    function renderLyrics() {
      display.innerHTML = '';
      activeIndex = -1;

      if (parsedLyrics.length === 0) {
        display.innerHTML = '<div class="line active">No lyrics loaded.</div>';
        return;
      }

      const fragment = document.createDocumentFragment();

      parsedLyrics.forEach((item, index) => {
        const lineEl = document.createElement('div');
        lineEl.className = 'line future';
        lineEl.id = `line-${index}`;

        item.words.forEach(w => {
          const wordSpan = document.createElement('span');
          wordSpan.className = 'word';
          wordSpan.textContent = w.text;

          const randColor = chaoticColors[Math.floor(Math.random() * chaoticColors.length)];
          const randFont = chaoticFonts[Math.floor(Math.random() * chaoticFonts.length)];
          const randDeg = (Math.random() > 0.5 ? 1 : -1) * (Math.floor(Math.random() * 6) + 2);

          wordSpan.style.setProperty('--rand-color', randColor);
          wordSpan.style.setProperty('--rand-font', randFont);
          wordSpan.style.setProperty('--rand-deg', `${randDeg}deg`);

          lineEl.appendChild(wordSpan);
        });

        fragment.appendChild(lineEl);
      });

      display.appendChild(fragment);
      syncLyricsToTime();
    }

    function parseLRC(lrcText) {
      hasWordLevelTimestamps = false;
      const lines = lrcText.split('\n');
      const rawResult = [];
      const lineTimeRegex = /\[(\d{2}):(\d{2})(?:\.(\d{1,3}))?\]/;

      for (const line of lines) {
        const match = lineTimeRegex.exec(line);
        if (!match) continue;

        const lineTime = parseInt(match[1]) * 60 + parseInt(match[2]) +
          (match[3] ? parseInt(match[3].padEnd(3, '0')) / 1000 : 0);

        let rawText = line
          .replace(lineTimeRegex, '')
          .replace(/\[.*?\]|\(.*?\)/g, '')
          .trim()
          .replace(/["'`]/g, '');

        if (!rawText) continue;

        if (/<(\d{2}):(\d{2})(?:\.(\d{1,3}))?>/.test(rawText)) {
          hasWordLevelTimestamps = true;
          const reg = /<(\d{2}):(\d{2})(?:\.(\d{1,3}))?>/g;
          let m;
          let lastPos = 0;
          let currentTime = lineTime;
          const allWords = [];

          while ((m = reg.exec(rawText)) !== null) {
            const textBefore = rawText.substring(lastPos, m.index).trim();
            if (textBefore) {
              textBefore.split(/\s+/).forEach(w => allWords.push({ text: w, time: currentTime }));
            }
            currentTime = parseInt(m[1]) * 60 + parseInt(m[2]) +
              (m[3] ? parseInt(m[3].padEnd(3, '0')) / 1000 : 0);
            lastPos = reg.lastIndex;
          }

          const textRemaining = rawText.substring(lastPos).trim();
          if (textRemaining) {
            textRemaining.split(/\s+/).forEach(w => allWords.push({ text: w, time: currentTime }));
          }

          if (allWords.length > 0) {
            rawResult.push({ time: lineTime, text: allWords.map(w => w.text).join(' '), words: allWords });
          }
        } else {
          rawResult.push({ time: lineTime, text: rawText, words: null });
        }
      }

      rawResult.sort((a, b) => a.time - b.time);

      for (let i = 0; i < rawResult.length; i++) {
        const item = rawResult[i];
        if (item.words) continue;

        const nextTime = rawResult[i + 1] ? rawResult[i + 1].time : item.time + 4.0;
        const lineDuration = Math.min(2.2, Math.max(1.0, nextTime - item.time));
        const wordArray = item.text.split(/\s+/);
        const step = lineDuration / Math.max(wordArray.length, 1);

        item.words = wordArray.map((w, idx) => ({
          text: w,
          time: item.time + (idx * step)
        }));
      }

      return rawResult;
    }

    function parseEmbeddedSYLT(arrayBuffer) {
      const view = new DataView(arrayBuffer);
      if (view.byteLength < 10) return null;
      if (String.fromCharCode(view.getUint8(0), view.getUint8(1), view.getUint8(2)) !== 'ID3') return null;

      const version = view.getUint8(3);
      let offset = 10;
      const totalSize = ((view.getUint8(6) & 0x7f) << 21) | ((view.getUint8(7) & 0x7f) << 14) |
                        ((view.getUint8(8) & 0x7f) << 7) | (view.getUint8(9) & 0x7f);

      while (offset < totalSize + 10 && offset + 10 < view.byteLength) {
        let frameId = '';
        for (let i = 0; i < 4; i++) frameId += String.fromCharCode(view.getUint8(offset + i));

        const frameSize = version === 4
          ? ((view.getUint8(offset + 4) & 0x7f) << 21) | ((view.getUint8(offset + 5) & 0x7f) << 14) |
            ((view.getUint8(offset + 6) & 0x7f) << 7) | (view.getUint8(offset + 7) & 0x7f)
          : view.getUint32(offset + 4, false);

        if (!frameId.trim() || frameSize <= 0) break;

        if (frameId === 'SYLT') {
          try {
            let p = offset + 10 + 6;
            while (p < offset + 10 + frameSize) {
              if (view.getUint8(p++) === 0) break;
            }

            const syltWords = [];
            while (p < offset + 10 + frameSize - 4) {
              let textChunk = '';
              while (p < offset + 10 + frameSize - 4) {
                const b = view.getUint8(p++);
                if (b === 0 || b === 0x0A || b === 0x0D) break;
                if (b >= 32) textChunk += String.fromCharCode(b);
              }
              textChunk = textChunk.trim();
              const timeMs = view.getUint32(p, false); p += 4;
              if (textChunk && !isNaN(timeMs)) {
                syltWords.push({ text: textChunk, time: timeMs / 1000.0 });
              }
            }

            if (syltWords.length === 0) break;

            syltWords.sort((a, b) => a.time - b.time);
            const groupedLines = [];
            let currentLine = { time: syltWords[0].time, text: '', words: [] };

            syltWords.forEach(w => {
              if (currentLine.words.length > 0 &&
                  w.time - currentLine.words[currentLine.words.length - 1].time > 2.5) {
                currentLine.text = currentLine.words.map(item => item.text).join(' ');
                groupedLines.push(currentLine);
                currentLine = { time: w.time, text: '', words: [] };
              }
              currentLine.words.push(w);
            });

            if (currentLine.words.length > 0) {
              currentLine.text = currentLine.words.map(item => item.text).join(' ');
              groupedLines.push(currentLine);
            }

            return { lines: groupedLines, count: syltWords.length };
          } catch (e) {}
        }
        offset += 10 + frameSize;
      }
      return null;
    }

    function detectScriptFamily(text) {
      for (const char of text) {
        const code = char.codePointAt(0);
        if (code >= 0x0900 && code <= 0x097F) return 'devanagari';
        if (code >= 0x0600 && code <= 0x06FF) return 'arabic';
      }
      return null;
    }

    function transliterateArabic(text) {
      const map = {
        'ء': "'", 'آ': "aa", 'أ': "a", 'ؤ': "w", 'إ': "i", 'ئ': "y", 'ا': "aa", 'ب': "b",
        'ة': "t", 'ت': "t", 'ث': "th", 'ج': "j", 'ح': "H", 'خ': "kh", 'د': "d", 'ذ': "dh",
        'ر': "r", 'ز': "z", 'س': "s", 'ش': "sh", 'ص': "S", 'ض': "D", 'ط': "T", 'ظ': "Z",
        'ع': "'", 'غ': "gh", 'ف': "f", 'ق': "q", 'ك': "k", 'ل': "l", 'م': "m", 'ن': "n",
        'ه': "h", 'و': "w", 'ى': "a", 'ي': "y", 'ی': "y", 'ے': "e"
      };
      let out = '';
      for (const ch of text) out += (map[ch] !== undefined) ? map[ch] : ch;
      return out;
    }

    function transliterateDevanagari(text) {
      const CONS = {
        'क': 'k', 'ख': 'kh', 'ग': 'g', 'घ': 'gh', 'च': 'ch', 'छ': 'Ch', 'ज': 'j', 'झ': 'jh',
        'ट': 'T', 'ठ': 'Th', 'ड': 'D', 'ढ': 'Dh', 'ण': 'N', 'त': 't', 'थ': 'th', 'द': 'd',
        'ध': 'dh', 'न': 'n', 'प': 'p', 'फ': 'f', 'ब': 'b', 'भ': 'bh', 'म': 'm', 'य': 'y',
        'र': 'r', 'ल': 'l', 'व': 'v', 'श': 'sh', 'ष': 'Sh', 'स': 's', 'ह': 'h'
      };
      const MATRAS = { 'ा': 'aa', 'ि': 'i', 'ी': 'ee', 'ु': 'u', 'ू': 'oo', 'े': 'e', 'ै': 'ai', 'ो': 'o', 'ौ': 'au' };
      let result = '';
      for (let i = 0; i < text.length; i++) {
        const ch = text[i];
        const next = text[i + 1];
        if (CONS[ch]) {
          if (next === '्') { result += CONS[ch]; i++; }
          else if (next && MATRAS[next]) { result += CONS[ch] + MATRAS[next]; i++; }
          else { result += CONS[ch] + 'a'; }
        } else {
          result += ch;
        }
      }
      return result;
    }

    async function romanizeText(text) {
      const script = detectScriptFamily(text);
      if (script === 'arabic') return transliterateArabic(text);
      if (script === 'devanagari') return transliterateDevanagari(text);
      return text;
    }

    async function romanizeLyricItem(item) {
      if (!item.text.trim()) return;
      const romanText = await romanizeText(item.text);
      if (romanText === item.text) return;

      const romanWords = romanText.split(/\s+/);
      if (item.words && item.words.length === romanWords.length) {
        item.words.forEach((w, idx) => { w.text = romanWords[idx]; });
      } else {
        const start = (item.words && item.words[0]) ? item.words[0].time : item.time;
        const end = (item.words && item.words.length > 0)
          ? item.words[item.words.length - 1].time + 1.0
          : item.time + 2.5;
        const step = (end - start) / Math.max(romanWords.length, 1);
        item.words = romanWords.map((rw, idx) => ({ text: rw, time: start + (idx * step) }));
      }
      item.text = romanText;
    }

    async function fetchTranslationsForLyrics() {
      if (!isRomanizeEnabled) return;
      const needsConversion = parsedLyrics.some(item => detectScriptFamily(item.text));
      if (!needsConversion) return;

      statusText.textContent = '🌐 Romanizing lyrics...';
      for (let i = 0; i < parsedLyrics.length; i += 5) {
        const batch = parsedLyrics.slice(i, i + 5);
        await Promise.all(batch.map(romanizeLyricItem));
      }
      renderLyrics();
      statusText.textContent = '✅ Lyrics Romanized!';
    }

    async function fetchOnlyLyrics(track, artist) {
      if (hasCustomLyricsLoaded) return;
      try {
        const query = `${track} ${artist}`.trim();
        statusText.textContent = 'Searching lyrics...';
        const response = await fetch(`https://lrclib.net/api/search?q=${encodeURIComponent(query)}`);
        if (!response.ok) throw new Error('Search failed');

        const data = await response.json();
        if (hasCustomLyricsLoaded) return;

        for (const item of data) {
          if (item.syncedLyrics) {
            parsedLyrics = parseLRC(item.syncedLyrics);
            renderLyrics();
            fetchTranslationsForLyrics();
            modalOverlay.classList.remove('open');
            statusText.textContent = '✅ Synced Lyrics Loaded!';
            return;
          }
        }

        for (const item of data) {
          if (item.plainLyrics) {
            const lines = item.plainLyrics.split('\n').filter(l => l.trim().length > 0);
            parsedLyrics = lines.map((line, i) => ({ time: i * 3.5, text: line, words: null }));
            renderLyrics();
            fetchTranslationsForLyrics();
            modalOverlay.classList.remove('open');
            statusText.textContent = '⚠️ Plain lyrics loaded.';
            return;
          }
        }
        display.innerHTML = '<div class="line active">No online lyrics found. Upload custom .ELRC!</div>';
        statusText.textContent = '⚠️ No lyrics found.';
      } catch (err) {
        statusText.textContent = 'Error loading online lyrics.';
      }
    }

    function safePlay() {
      initAudioEngine();
      if (audioCtx && audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
      const playPromise = audioPlayer.play();
      if (playPromise !== undefined) {
        playPromise.catch(err => {
          console.warn('Playback deferred or interrupted:', err);
        });
      }
    }

    function applyTrackMeta(title, artist) {
      displayTitle.textContent = title;
      displayArtist.textContent = artist;
      trackInput.value = title;
      artistInput.value = artist !== 'Local MP3' ? artist : '';
      lyricOffset = 0;
      offsetVal.textContent = '0.0s';

      const startPlayback = () => {
        durTimeText.textContent = formatTime(audioPlayer.duration);
        if (!hasCustomLyricsLoaded) {
          fetchOnlyLyrics(title, artist === 'Local MP3' ? '' : artist);
        }
        safePlay();
      };

      if (audioPlayer.readyState >= 1) startPlayback();
      else audioPlayer.addEventListener('loadedmetadata', startPlayback, { once: true });
    }

    function applyTheme(themeType) {
      themeCircles.forEach(c => c.classList.remove('active'));
      rgbWrapper.classList.remove('active');

      const themeMap = {
        custom: () => { rgbWrapper.classList.add('active'); const col = rgbPicker.value; bgBlur.style.background = '#12091f'; glow1.style.background = col; glow2.style.background = '#4a044e'; glow3.style.background = col; },
        random: () => { document.querySelector('.theme-circle[data-bg="random"]')?.classList.add('active'); bgBlur.style.background = '#12091f'; glow1.style.background = getRandomColor(); glow2.style.background = getRandomColor(); glow3.style.background = getRandomColor(); },
        dynamic: () => { document.querySelector('.theme-circle[data-bg="dynamic"]')?.classList.add('active'); bgBlur.style.background = currentDynamicImg !== 'none' ? `url('${currentDynamicImg}')` : '#1a0b2e'; glow1.style.background = '#9333ea'; glow2.style.background = '#e11d48'; glow3.style.background = '#3b82f6'; },
        blue: () => { document.querySelector('.theme-circle[data-bg="blue"]')?.classList.add('active'); bgBlur.style.background = '#0b1d3a'; glow1.style.background = '#06b6d4'; glow2.style.background = '#1e3a8a'; glow3.style.background = '#3b82f6'; },
        black: () => { document.querySelector('.theme-circle[data-bg="black"]')?.classList.add('active'); bgBlur.style.background = '#12091f'; glow1.style.background = '#4c1d95'; glow2.style.background = '#831843'; glow3.style.background = '#1e1b4b'; }
      };

      (themeMap[themeType] || themeMap.dynamic)();
      localStorage.setItem('appTheme', themeType);
      currentTheme = themeType;
    }

    function applyLyricStyle(styleType) {
      styleBtns.forEach(btn => btn.classList.remove('active'));
      document.querySelector(`.style-btn[data-style="${styleType}"]`)?.classList.add('active');
      display.className = `lyrics-panel lyrics-${styleType}`;
      localStorage.setItem('lyricStyle', styleType);
      currentStyle = styleType;
    }

    function applyTextAlign(alignVal) {
      alignBtns.forEach(btn => btn.classList.remove('active'));
      document.querySelector(`.align-btn[data-align="${alignVal}"]`)?.classList.add('active');
      document.documentElement.style.setProperty('--text-align', alignVal);
      localStorage.setItem('textAlign', alignVal);
      currentTextAlign = alignVal;
    }

    audioPlayer.addEventListener('play', () => {
      playBtn.innerHTML = pauseSVG;
      initAudioEngine();
      if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
      syncLyricsToTime();
    });

    audioPlayer.addEventListener('pause', () => {
      playBtn.innerHTML = playSVG;
    });

    audioPlayer.addEventListener('timeupdate', syncLyricsToTime);

    playBtn.addEventListener('click', () => {
      if (audioPlayer.paused) {
        if (audioPlayer.src) safePlay();
        else {
          settingsCard.style.display = 'block';
          modalOverlay.classList.add('open');
        }
      } else {
        audioPlayer.pause();
      }
    });

    gearBtn.addEventListener('click', () => {
      settingsCard.style.display = 'block';
      eqCard.style.display = 'none';
      playlistCard.style.display = 'none';
      modalOverlay.classList.add('open');
    });

    eqBtn.addEventListener('click', () => {
      settingsCard.style.display = 'none';
      eqCard.style.display = 'block';
      playlistCard.style.display = 'none';
      modalOverlay.classList.add('open');
    });

    playlistBtn.addEventListener('click', () => {
      settingsCard.style.display = 'none';
      eqCard.style.display = 'none';
      playlistCard.style.display = 'block';
      modalOverlay.classList.add('open');
    });

    closeModalBtn.addEventListener('click', () => modalOverlay.classList.remove('open'));
    closeEqBtn.addEventListener('click', () => modalOverlay.classList.remove('open'));
    closePlaylistBtn.addEventListener('click', () => modalOverlay.classList.remove('open'));

    display.addEventListener('click', e => {
      const line = e.target.closest('.line');
      if (!line || !line.id) return;
      const idx = parseInt(line.id.replace('line-', ''), 10);
      if (parsedLyrics[idx]) {
        audioPlayer.currentTime = Math.max(0, parsedLyrics[idx].time + lyricOffset);
        safePlay();
      }
    });

    seekSlider.addEventListener('input', () => {
      isUserSeeking = true;
      currTimeText.textContent = formatTime((seekSlider.value / 100) * (audioPlayer.duration || 0));
    });

    seekSlider.addEventListener('change', () => {
      audioPlayer.currentTime = (seekSlider.value / 100) * (audioPlayer.duration || 0);
      isUserSeeking = false;
      syncLyricsToTime();
    });

    audioFileInput.addEventListener('change', e => {
      const file = e.target.files[0];
      if (!file) return;

      hasCustomLyricsLoaded = false;
      lrcFileInput.value = '';
      removeLrcBtn.style.display = 'none';

      audioPlayer.src = URL.createObjectURL(file);
      audioBtnLabel.textContent = `✅ ${file.name}`;
      statusText.textContent = 'Audio file loaded.';

      const rawName = file.name.replace(/\.[^/.]+$/, '').replace(/[_-]/g, ' ');
      playerArt.style.backgroundImage = 'none';
      playerArt.textContent = '🎵';
      currentDynamicImg = 'none';
      if (currentTheme === 'dynamic') applyTheme('dynamic');

      const reader = new FileReader();
      reader.onload = evt => {
        const syltData = parseEmbeddedSYLT(evt.target.result);
        if (syltData?.lines?.length > 0) {
          parsedLyrics = syltData.lines;
          hasWordLevelTimestamps = true;
          hasCustomLyricsLoaded = true;
          renderLyrics();
          fetchTranslationsForLyrics();
          statusText.textContent = `Found ${syltData.count} synced words in audio file.`;
        }
      };
      reader.readAsArrayBuffer(file.slice(0, 131072));

      if (window.jsmediatags) {
        window.jsmediatags.read(file, {
          onSuccess: tag => {
            const t = tag.tags;
            if (t.picture) {
              let base64String = '';
              for (let i = 0; i < t.picture.data.length; i++) {
                base64String += String.fromCharCode(t.picture.data[i]);
              }
              const base64 = `data:${t.picture.format};base64,${window.btoa(base64String)}`;
              currentDynamicImg = base64;
              playerArt.style.backgroundImage = `url('${base64}')`;
              playerArt.textContent = '';
              if (currentTheme === 'dynamic') applyTheme('dynamic');
            }
            applyTrackMeta(t.title || rawName, t.artist || 'Local MP3');
          },
          onError: () => applyTrackMeta(rawName, 'Local MP3')
        });
      } else {
        applyTrackMeta(rawName, 'Local MP3');
      }
    });

    lrcFileInput.addEventListener('change', e => {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = evt => {
        parsedLyrics = parseLRC(evt.target.result);
        hasCustomLyricsLoaded = true;
        removeLrcBtn.style.display = 'block';
        renderLyrics();
        fetchTranslationsForLyrics();
        lrcBtnLabel.textContent = `✅ ${file.name}`;
        modalOverlay.classList.remove('open');
      };
      reader.readAsText(file);
    });

    removeLrcBtn.addEventListener('click', () => {
      hasCustomLyricsLoaded = false;
      lrcFileInput.value = '';
      lrcBtnLabel.textContent = '📄 Upload Custom .ELRC';
      removeLrcBtn.style.display = 'none';
      fetchOnlyLyrics(trackInput.value.trim(), artistInput.value.trim());
    });

    searchBtn.addEventListener('click', () => {
      fetchOnlyLyrics(trackInput.value.trim(), artistInput.value.trim());
    });

    tapSyncBtn.addEventListener('click', () => {
      if (parsedLyrics.length > 0 && audioPlayer.currentTime > 0) {
        lyricOffset = audioPlayer.currentTime - parsedLyrics[0].time;
        offsetVal.textContent = `${lyricOffset >= 0 ? '+' : ''}${lyricOffset.toFixed(1)}s`;
      }
    });

    function adjustOffset(v) {
      lyricOffset += v;
      offsetVal.textContent = `${lyricOffset >= 0 ? '+' : ''}${lyricOffset.toFixed(1)}s`;
    }

    document.getElementById('m1').addEventListener('click', () => adjustOffset(-1));
    document.getElementById('m01').addEventListener('click', () => adjustOffset(-0.1));
    document.getElementById('p01').addEventListener('click', () => adjustOffset(0.1));
    document.getElementById('p1').addEventListener('click', () => adjustOffset(1));
    document.getElementById('mReset').addEventListener('click', () => {
      lyricOffset = 0;
      offsetVal.textContent = '0.0s';
    });

    document.getElementById('spatialSlider').addEventListener('input', e => {
      if (spatialNode) spatialNode.delayTime.value = (parseFloat(e.target.value) / 10) * 0.025;
    });
    document.getElementById('pannerSlider').addEventListener('input', e => {
      if (pannerNode?.pan) pannerNode.pan.value = parseFloat(e.target.value);
    });
    document.getElementById('bassBoostSlider').addEventListener('input', e => {
      if (bassFilter) bassFilter.gain.value = parseFloat(e.target.value);
    });

    const bandMap = { eq60: 60, eq250: 250, eq1k: 1000, eq4k: 4000, eq12k: 12000 };
    Object.entries(bandMap).forEach(([id, freq]) => {
      document.getElementById(id).addEventListener('input', e => {
        if (eqBands[freq]) eqBands[freq].gain.value = parseFloat(e.target.value);
      });
    });

    document.getElementById('resetEqBtn').addEventListener('click', () => {
      if (bassFilter) bassFilter.gain.value = 0;
      if (spatialNode) spatialNode.delayTime.value = 0;
      if (pannerNode?.pan) pannerNode.pan.value = 0;
      Object.keys(bandMap).forEach(id => {
        document.getElementById(id).value = 0;
        if (eqBands[bandMap[id]]) eqBands[bandMap[id]].gain.value = 0;
      });
    });

    const themeCircles = document.querySelectorAll('.theme-circle');
    themeCircles.forEach(circle => {
      circle.addEventListener('click', () => applyTheme(circle.getAttribute('data-bg')));
    });

    const styleBtns = document.querySelectorAll('.style-btn');
    styleBtns.forEach(btn => {
      btn.addEventListener('click', () => applyLyricStyle(btn.getAttribute('data-style')));
    });

    const alignBtns = document.querySelectorAll('.align-btn');
    alignBtns.forEach(btn => {
      btn.addEventListener('click', () => applyTextAlign(btn.getAttribute('data-align')));
    });

    fullscreenBtn.addEventListener('click', () => {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen().catch(() => {});
        document.body.classList.add('is-fullscreen');
      } else {
        document.exitFullscreen().catch(() => {});
        document.body.classList.remove('is-fullscreen');
      }
    });

    audioPlayer.addEventListener('ended', () => {
      if (autoAdvance && playlist.length > 1) {
        let next = playlistIndex + 1;
        if (next >= playlist.length) next = 0;
        playPlaylistIndex(next);
      }
    });

    const playSVG = '<svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>';
    const pauseSVG = '<svg viewBox="0 0 24 24"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>';

    applyTheme(currentTheme);
    applyLyricStyle(currentStyle);
    applyTextAlign(currentTextAlign);
  </script>
</body>
</html>
