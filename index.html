<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Apple Music Lyrics Pro</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jsmediatags/3.9.5/jsmediatags.min.js"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", Roboto, Helvetica, Arial, sans-serif;
      background: #000000;
      color: #ffffff;
      height: 100vh;
      height: 100dvh;
      overflow: hidden;
      display: flex;
    }

    .bg-blur {
      position: absolute;
      top: -10%;
      left: -10%;
      width: 120%;
      height: 120%;
      background: radial-gradient(circle, #4a154b 0%, #111111 80%);
      filter: blur(60px);
      z-index: 1;
    }

    .app-container {
      position: relative;
      z-index: 2;
      display: flex;
      width: 100%;
      height: 100%;
      padding-bottom: 170px;
    }

    .dev-badge {
      position: absolute;
      top: 18px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 999;
      font-size: 0.8rem;
      font-weight: 800;
      letter-spacing: 0.5px;
      color: #ffffff;
      background: rgba(255, 255, 255, 0.12);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      padding: 0.5rem 1.2rem;
      border-radius: 20px;
      border: 1px solid rgba(255, 255, 255, 0.2);
      box-shadow: 0 4px 15px rgba(0,0,0,0.4);
      pointer-events: none;
      text-transform: uppercase;
    }

    .fullscreen-btn {
      position: absolute;
      top: 16px;
      right: 16px;
      z-index: 999;
      background: rgba(255, 255, 255, 0.12);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: #ffffff;
      width: 38px;
      height: 38px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }

    .fullscreen-btn svg {
      width: 18px;
      height: 18px;
      fill: #ffffff;
    }

    .retrack-btn {
      position: fixed;
      right: 1.2rem;
      bottom: 11.5rem;
      z-index: 99;
      background: rgba(255, 255, 255, 0.2);
      backdrop-filter: blur(15px);
      -webkit-backdrop-filter: blur(15px);
      border: 1px solid rgba(255, 255, 255, 0.3);
      color: #ffffff;
      padding: 0.55rem 1rem;
      border-radius: 20px;
      font-size: 0.78rem;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 0.4rem;
      cursor: pointer;
      opacity: 0;
      pointer-events: none;
      transform: translateY(10px);
      transition: opacity 0.3s ease, transform 0.3s ease;
    }

    .retrack-btn.visible {
      opacity: 1;
      pointer-events: auto;
      transform: translateY(0);
    }

    .lyrics-panel {
      flex: 1;
      height: 100%;
      overflow-y: auto;
      padding: 40vh 1.8rem 20vh 1.8rem;
      scrollbar-width: none;
    }

    .lyrics-panel::-webkit-scrollbar {
      display: none;
    }

    .line {
      font-size: clamp(2rem, 6.5vw, 3.2rem);
      font-weight: 800;
      line-height: 1.35;
      margin-bottom: clamp(2rem, 5.5vw, 3rem);
      cursor: pointer;
      color: rgba(255, 255, 255, 0.25);
      filter: blur(6px);
      opacity: 0.35;
      transform: scale(0.92);
      transition: filter 0.45s ease, opacity 0.45s ease, transform 0.45s ease;
    }

    .line.past {
      color: rgba(255, 255, 255, 0.35);
      filter: blur(0px);
      opacity: 0.45;
      transform: scale(0.95);
    }

    .line.active {
      opacity: 1;
      filter: blur(0px);
      transform: scale(1.04);
      color: #ffffff;
    }

    .line .word {
      display: inline-block;
      margin-right: 0.25em;
      color: rgba(255, 255, 255, 0.3);
      transition: color 0.15s ease;
    }

    .line.active .word.filled {
      color: #ffffff;
      text-shadow: 0 0 15px rgba(255, 255, 255, 0.6);
    }

    .lyrics-footer {
      margin-top: 4rem;
      padding-top: 1.5rem;
      padding-bottom: 3rem;
      font-size: 0.85rem;
      font-weight: 700;
      color: rgba(255, 255, 255, 0.4);
      border-top: 1px solid rgba(255, 255, 255, 0.1);
      letter-spacing: 0.5px;
    }

    .player-bar {
      position: fixed;
      bottom: 1.2rem;
      left: 50%;
      transform: translateX(-50%);
      width: calc(100% - 1.8rem);
      max-width: 520px;
      background: rgba(30, 30, 35, 0.85);
      backdrop-filter: blur(35px);
      -webkit-backdrop-filter: blur(35px);
      border: 1px solid rgba(255, 255, 255, 0.18);
      border-radius: 28px;
      padding: 0.8rem 1rem;
      z-index: 100;
      box-shadow: 0 15px 35px rgba(0,0,0,0.6);
      display: flex;
      flex-direction: column;
      gap: 0.6rem;
    }

    .player-info {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .track-meta {
      display: flex;
      align-items: center;
      gap: 0.8rem;
      overflow: hidden;
    }

    .album-art {
      width: 44px;
      height: 44px;
      border-radius: 12px;
      background: rgba(255,255,255,0.1);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.3rem;
      flex-shrink: 0;
      background-size: cover;
      background-position: center;
    }

    .track-text {
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .track-title {
      font-weight: 700;
      font-size: 0.95rem;
    }

    .track-artist {
      font-size: 0.8rem;
      opacity: 0.65;
      margin-top: 1px;
    }

    .controls {
      display: flex;
      align-items: center;
      gap: 0.6rem;
    }

    .btn-icon {
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: #ffffff;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 40px;
      height: 40px;
      border-radius: 50%;
    }

    .btn-play {
      background: #ffffff;
      color: #000000;
      border: none;
    }

    .btn-play svg {
      fill: #000000;
      width: 18px;
      height: 18px;
    }

    .btn-gear svg {
      fill: #ffffff;
      width: 18px;
      height: 18px;
    }

    .scrubber-box {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 0.2rem;
    }

    .seek-slider {
      -webkit-appearance: none;
      appearance: none;
      width: 100%;
      height: 5px;
      border-radius: 3px;
      background: rgba(255, 255, 255, 0.2);
      outline: none;
      cursor: pointer;
    }

    .seek-slider::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 13px;
      height: 13px;
      border-radius: 50%;
      background: #ffffff;
      cursor: pointer;
    }

    .time-labels {
      display: flex;
      justify-content: space-between;
      font-size: 0.7rem;
      font-weight: 600;
      opacity: 0.55;
    }

    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.65);
      backdrop-filter: blur(12px);
      z-index: 1000;
      display: flex;
      align-items: flex-end;
      justify-content: center;
    }

    .modal-card {
      width: 100%;
      max-width: 520px;
      max-height: 90vh;
      background: #1c1c1e;
      border-radius: 28px 28px 0 0;
      padding: 1.5rem;
      box-shadow: 0 -10px 40px rgba(0,0,0,0.8);
      position: relative;
      display: flex;
      flex-direction: column;
    }

    .modal-close {
      position: absolute;
      top: 1.2rem;
      right: 1.2rem;
      background: rgba(255,255,255,0.1);
      border: none;
      color: #ffffff;
      width: 30px;
      height: 30px;
      border-radius: 50%;
      font-size: 1rem;
      cursor: pointer;
    }

    .modal-title {
      font-size: 1.2rem;
      font-weight: 700;
      margin-bottom: 1.2rem;
    }

    .input-group {
      margin-bottom: 1rem;
    }

    .input-group label {
      display: block;
      font-size: 0.8rem;
      opacity: 0.7;
      margin-bottom: 0.4rem;
    }

    .input-control {
      width: 100%;
      padding: 0.75rem 1rem;
      border-radius: 12px;
      border: 1px solid rgba(255,255,255,0.15);
      background: rgba(255,255,255,0.08);
      color: #ffffff;
      font-size: 0.95rem;
      outline: none;
    }

    .file-btn {
      width: 100%;
      padding: 0.85rem;
      border-radius: 14px;
      background: rgba(255,255,255,0.08);
      border: 1px dashed rgba(255,255,255,0.3);
      color: #ffffff;
      font-weight: 600;
      cursor: pointer;
      text-align: center;
      margin-bottom: 1rem;
      display: block;
    }

    .btn-action {
      width: 100%;
      padding: 0.85rem;
      border-radius: 14px;
      background: #ffffff;
      color: #000000;
      font-weight: 700;
      border: none;
      cursor: pointer;
      font-size: 1rem;
      margin-top: 0.5rem;
    }

    .status-text {
      font-size: 0.8rem;
      color: #34c759;
      margin-top: 0.8rem;
      text-align: center;
      min-height: 1.2em;
    }
  </style>
</head>
<body>

  <div class="bg-blur" id="bgBlur"></div>

  <div class="app-container">
    <div class="dev-badge">MADE BY CHINNU</div>

    <button class="fullscreen-btn" id="fullscreenBtn" aria-label="Toggle Fullscreen">
      <svg viewBox="0 0 24 24"><path d="M7 14H5v5h5v-2H7v-3zm-2-4h2V7h3V5H5v5zm12 7h-3v2h5v-5h-2v3zM14 5v2h3v3h2V5h-5z"/></svg>
    </button>

    <button class="retrack-btn" id="retrackBtn">
      <span>⬇ Track Line</span>
    </button>

    <div class="lyrics-panel" id="lyricsDisplay">
      <div class="line">Tap ⚙️ below to choose your MP3 file & load lyrics!</div>
    </div>
  </div>

  <div class="player-bar">
    <div class="player-info">
      <div class="track-meta">
        <div class="album-art" id="playerArt">🎵</div>
        <div class="track-text">
          <div class="track-title" id="displayTitle">No Track Loaded</div>
          <div class="track-artist" id="displayArtist">Tap gear to configure</div>
        </div>
      </div>
      <div class="controls">
        <button class="btn-icon btn-play" id="playBtn" aria-label="Play/Pause">
          <svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
        </button>
        <button class="btn-icon btn-gear" id="gearBtn" aria-label="Settings">
          <svg viewBox="0 0 24 24"><path d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58c.18-.14.23-.41.12-.61l-1.92-3.32c-.12-.22-.37-.29-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54c-.04-.24-.24-.41-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96c-.22-.08-.47 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.05.3-.09.63-.09.94s.02.64.07.94l-2.03 1.58c-.18.14-.23.41-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c-.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6c-1.98 0-3.6-1.62-3.6-3.6s1.62-3.6 3.6-3.6 3.6 1.62 3.6 3.6-1.62 3.6-3.6-3.6z"/></svg>
        </button>
      </div>
    </div>
    
    <div class="scrubber-box">
      <input type="range" class="seek-slider" id="seekSlider" min="0" max="100" value="0" step="0.1" />
      <div class="time-labels">
        <span id="currTime">0:00</span>
        <span id="durTime">0:00</span>
      </div>
    </div>
  </div>

  <audio id="audioPlayer"></audio>

  <div class="modal-overlay" id="modalOverlay">
    <div class="modal-card">
      <button class="modal-close" id="closeModalBtn">✕</button>
      <div class="modal-title">Song & Lyrics Options</div>

      <label class="file-btn" for="audioFileInput">
        📁 Choose Local Audio File (.mp3, .m4a)
      </label>
      <input type="file" id="audioFileInput" accept="audio/*" style="display:none;" />

      <div class="input-group">
        <label>Song Title</label>
        <input type="text" class="input-control" id="songTitleInput" placeholder="e.g. Husn" />
      </div>

      <div class="input-group">
        <label>Artist Name</label>
        <input type="text" class="input-control" id="artistNameInput" placeholder="e.g. Anuv Jain" />
      </div>

      <button class="btn-action" id="searchPlayBtn">Search & Play Song</button>

      <div class="status-text" id="statusText">Ready. Upload MP3 and enter title/artist to load lyrics.</div>
    </div>
  </div>

  <script>
    const audioPlayer = document.getElementById('audioPlayer');
    const display = document.getElementById('lyricsDisplay');
    const playBtn = document.getElementById('playBtn');
    const gearBtn = document.getElementById('gearBtn');
    const closeModalBtn = document.getElementById('closeModalBtn');
    const modalOverlay = document.getElementById('modalOverlay');
    const searchPlayBtn = document.getElementById('searchPlayBtn');
    const songTitleInput = document.getElementById('songTitleInput');
    const artistNameInput = document.getElementById('artistNameInput');
    const audioFileInput = document.getElementById('audioFileInput');
    const statusText = document.getElementById('statusText');
    const seekSlider = document.getElementById('seekSlider');
    const currTimeText = document.getElementById('currTime');
    const durTimeText = document.getElementById('durTime');
    const retrackBtn = document.getElementById('retrackBtn');
    const playerArt = document.getElementById('playerArt');
    
    let parsedLyrics = [];
    let autoScrollEnabled = true;
    let isUserSeeking = false;
    let activeIndex = -1;

    const playHTML = '<svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>';
    const pauseHTML = '<svg viewBox="0 0 24 24"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>';

    audioPlayer.addEventListener('play', () => { playBtn.innerHTML = pauseHTML; });
    audioPlayer.addEventListener('pause', () => { playBtn.innerHTML = playHTML; });
    audioPlayer.addEventListener('ended', () => { playBtn.innerHTML = playHTML; });

    function formatTime(secs) {
      if (isNaN(secs) || !isFinite(secs)) return '0:00';
      const m = Math.floor(secs / 60);
      const s = Math.floor(secs % 60);
      return `${m}:${s < 10 ? '0' : ''}${s}`;
    }

    function parseLRC(lrcText) {
      if (!lrcText) return [];
      const lines = lrcText.split('\n');
      const result = [];
      const timeRegex = /\[(\d{2}):(\d{2})(?:\.(\d{1,3}))?\]/;

      for (let line of lines) {
        const match = timeRegex.exec(line);
        if (match) {
          const minutes = parseInt(match[1], 10);
          const seconds = parseInt(match[2], 10);
          const millisStr = match[3] ? match[3].padEnd(3, '0') : '000';
          const millis = parseInt(millisStr, 10);
          const time = minutes * 60 + seconds + millis / 1000;
          const text = line.replace(timeRegex, '').trim();

          if (text) {
            result.push({ time, text });
          }
        }
      }
      return result.sort((a, b) => a.time - b.time);
    }

    function renderLyrics() {
      display.innerHTML = '';
      if (parsedLyrics.length === 0) {
        display.innerHTML = '<div class="line">No timed lyrics found for this track.</div>';
        return;
      }

      parsedLyrics.forEach((item, index) => {
        const lineEl = document.createElement('div');
        lineEl.className = 'line';
        lineEl.id = `line-${index}`;

        const words = item.text.split(' ');
        words.forEach((wordText) => {
          const wordSpan = document.createElement('span');
          wordSpan.className = 'word';
          wordSpan.innerText = wordText;
          lineEl.appendChild(wordSpan);
        });

        lineEl.addEventListener('click', () => {
          audioPlayer.currentTime = Math.max(0, item.time);
          audioPlayer.play();
          reTrackToCurrentLine();
        });

        display.appendChild(lineEl);
      });

      const footer = document.createElement('div');
      footer.className = 'lyrics-footer';
      footer.innerHTML = 'MADE BY <span style="color:#fff;">CHINNU</span>';
      display.appendChild(footer);
    }

    function reTrackToCurrentLine() {
      autoScrollEnabled = true;
      retrackBtn.classList.remove('visible');

      if (activeIndex >= 0) {
        const el = document.getElementById(`line-${activeIndex}`);
        if (el) {
          const panelHeight = display.clientHeight;
          const lineOffsetTop = el.offsetTop;
          const lineHeight = el.clientHeight;
          const targetScroll = lineOffsetTop - (panelHeight / 2) + (lineHeight / 2);

          display.scrollTo({
            top: targetScroll,
            behavior: 'smooth'
          });
        }
      }
    }

    audioFileInput.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (file) {
        audioPlayer.pause();
        audioPlayer.removeAttribute('src');
        audioPlayer.load();

        const fileUrl = URL.createObjectURL(file);
        audioPlayer.src = fileUrl;
        audioPlayer.load();

        let rawName = file.name.replace(/\.[^/.]+$/, "");
        let cleanTitle = rawName.replace(/[_]/g, " ").replace(/-/g, " ");
        songTitleInput.value = cleanTitle;

        window.jsmediatags.read(file, {
          onSuccess: function(tag) {
            const tags = tag.tags;
            if (tags.title) {
              cleanTitle = tags.title;
              songTitleInput.value = cleanTitle;
            }
            if (tags.artist) {
              artistNameInput.value = tags.artist;
            }

            if (tags.picture) {
              const { data, format } = tags.picture;
              let base64String = "";
              for (let i = 0; i < data.length; i++) {
                base64String += String.fromCharCode(data[i]);
              }
              const imageUrl = `data:${format};base64,${window.btoa(base64String)}`;
              playerArt.style.backgroundImage = `url('${imageUrl}')`;
              playerArt.innerText = "";
            }

            document.getElementById('displayTitle').innerText = cleanTitle;
            document.getElementById('displayArtist').innerText = artistNameInput.value || "Local MP3";
          },
          onError: function() {
            document.getElementById('displayTitle').innerText = cleanTitle;
            document.getElementById('displayArtist').innerText = "Local MP3";
          }
        });

        statusText.innerText = "File loaded. Click 'Search & Play Song' to fetch lyrics.";
      }
    });

    searchPlayBtn.addEventListener('click', async () => {
      const title = songTitleInput.value.trim();
      const artist = artistNameInput.value.trim();

      if (!title) {
        statusText.innerText = "Please enter a song title.";
        return;
      }

      statusText.innerText = "Fetching lyrics...";

      try {
        const query = `${title} ${artist}`;
        const response = await fetch(`https://lrclib.net/api/search?q=${encodeURIComponent(query)}`);
        const data = await response.json();

        if (Array.isArray(data) && data.length > 0) {
          let found = false;
          for (let item of data) {
            if (item.syncedLyrics) {
              const parsed = parseLRC(item.syncedLyrics);
              if (parsed.length > 0) {
                parsedLyrics = parsed;
                renderLyrics();
                document.getElementById('displayTitle').innerText = title;
                document.getElementById('displayArtist').innerText = artist || "Local MP3";
                statusText.innerText = "Lyrics loaded successfully!";
                found = true;
                modalOverlay.classList.remove('open');
                if (audioPlayer.src) audioPlayer.play();
                break;
              }
            }
          }
          if (!found) {
            statusText.innerText = "No synced lyrics found for this track.";
          }
        } else {
          statusText.innerText = "No results found on lyrics server.";
        }
      } catch (err) {
        statusText.innerText = "Network restriction or connection error.";
      }
    });

    audioPlayer.addEventListener('timeupdate', () => {
      const currentTime = audioPlayer.currentTime;
      activeIndex = -1;

      for (let i = 0; i < parsedLyrics.length; i++) {
        if (currentTime >= parsedLyrics[i].time) {
          activeIndex = i;
        } else {
          break;
        }
      }

      const allLines = document.querySelectorAll('.line');
      allLines.forEach((el, index) => {
        const wordSpans = el.querySelectorAll('.word');

        if (index < activeIndex) {
          el.classList.add('past');
          el.classList.remove('active');
          wordSpans.forEach(w => w.classList.add('filled'));
        } else if (index === activeIndex) {
          el.classList.remove('past');
          
          if (!el.classList.contains('active')) {
            el.classList.add('active');

            if (autoScrollEnabled) {
              const panelHeight = display.clientHeight;
              const lineOffsetTop = el.offsetTop;
              const lineHeight = el.clientHeight;
              const targetScroll = lineOffsetTop - (panelHeight / 2) + (lineHeight / 2);

              display.scrollTo({
                top: targetScroll,
                behavior: 'smooth'
              });
            }
          }

          const currentLineTime = parsedLyrics[activeIndex].time;
          const nextLineTime = parsedLyrics[activeIndex + 1] 
            ? parsedLyrics[activeIndex + 1].time 
            : currentLineTime + 4.0;

          const lineDuration = nextLineTime - currentLineTime;
          const progress = Math.min(Math.max((currentTime - currentLineTime) / lineDuration, 0), 1);
          const wordsToFill = Math.floor(progress * wordSpans.length);

          wordSpans.forEach((wSpan, wIdx) => {
            if (wIdx <= wordsToFill) {
              wSpan.classList.add('filled');
            } else {
              wSpan.classList.remove('filled');
            }
          });
        } else {
          el.classList.remove('past', 'active');
          wordSpans.forEach(w => w.classList.remove('filled'));
        }
      });

      if (audioPlayer.duration && !isNaN(audioPlayer.duration) && !isUserSeeking) {
        const pct = (audioPlayer.currentTime / audioPlayer.duration) * 100;
        seekSlider.value = pct;
        currTimeText.innerText = formatTime(audioPlayer.currentTime);
        durTimeText.innerText = formatTime(audioPlayer.duration);
      }
    });

    playBtn.addEventListener('click', () => {
      if (audioPlayer.paused) {
        if (audioPlayer.src) {
          audioPlayer.play();
        } else {
          modalOverlay.classList.add('open');
        }
      } else {
        audioPlayer.pause();
      }
    });

    gearBtn.addEventListener('click', () => modalOverlay.classList.add('open'));
    closeModalBtn.addEventListener('click', () => modalOverlay.classList.remove('open'));
    retrackBtn.addEventListener('click', reTrackToCurrentLine);

    seekSlider.addEventListener('input', () => {
      isUserSeeking = true;
      if (audioPlayer.duration) {
        const targetTime = (seekSlider.value / 100) * audioPlayer.duration;
        currTimeText.innerText = formatTime(targetTime);
      }
    });

    seekSlider.addEventListener('change', () => {
      if (audioPlayer.duration) {
        audioPlayer.currentTime = (seekSlider.value / 100) * audioPlayer.duration;
      }
      isUserSeeking = false;
      reTrackToCurrentLine();
    });

    function handleManualScroll() {
      autoScrollEnabled = false;
      if (parsedLyrics.length > 0) {
        retrackBtn.classList.add('visible');
      }
    }

    display.addEventListener('wheel', handleManualScroll);
    display.addEventListener('touchmove', handleManualScroll);
  </script>
</body>
</html>
